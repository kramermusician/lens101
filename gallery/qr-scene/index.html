<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QR Scene</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#f3ead8;overflow:hidden;font-family:-apple-system,"Helvetica Neue",sans-serif}
  canvas{display:block}
  #hud{position:fixed;left:18px;bottom:16px;color:#3b4a3f;font-size:15px;background:rgba(243,234,216,.85);padding:8px 12px;border-radius:10px;transition:opacity .6s}
  #hud b{font-weight:600}
  #label{position:fixed;top:18px;left:0;right:0;text-align:center;font-size:30px;color:#2f4a5a;opacity:0;transition:opacity .8s}
  body.clean #hud{opacity:0}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script src="codes.js"></script>
</head>
<body>
<div id="label"></div>
<div id="hud"></div>
<script type="module">
import * as THREE from "three";

const P = new URLSearchParams(location.search);
const CODES = window.QR_CODES;
const THEMES = [
  { name:"City",      ground:0xf3ead8, top:0x1b2330, side:[0x6f8f7a,0x88a6b8,0xc9a27a,0x9a8fb0], h:(x,y,n)=>1+Math.pow(hash(x,y),2.2)*9, idle:0 },
  { name:"Equalizer", ground:0xf3ead8, top:0x1b2330, side:[0xd9825b,0xe0a458,0x6f8f7a,0x4f7a99], h:(x,y,n,t)=>1.5+5*(0.5+0.5*Math.sin(x*0.45+t*2.2))*(0.6+0.4*Math.cos(y*0.3)), idle:1 },
  { name:"Wave",      ground:0xf3ead8, top:0x1b2330, side:[0x4f7a99,0x6fa0b5,0x9cc3c9,0x6f8f7a], h:(x,y,n,t)=>1+3.5*(1+Math.sin(Math.hypot(x-n/2,y-n/2)*0.5-t*1.6)), idle:1 },
];
function hash(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }

let codeIdx = Math.min(+(P.get("code")||0), CODES.length-1);
let themeIdx = Math.min(+(P.get("theme")||0), THEMES.length-1);
let reveal = P.get("reveal")==="1" ? 1 : 0, target = reveal;
const showLabel = P.get("label")!=="0";
if (P.get("clean")==="1") document.body.classList.add("clean");

const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 20000);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(-30,60,40); scene.add(sun);

let group, blocks = [], N = 0;
function build(){
  if (group) { scene.remove(group); group.traverse(o=>{o.geometry&&o.geometry.dispose();}); }
  const th = THEMES[themeIdx], m = CODES[codeIdx].m; N = m.length;
  scene.background = new THREE.Color(th.ground);
  group = new THREE.Group(); scene.add(group); blocks = [];
  const Q = 4; // quiet zone in modules
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(N+2*Q, N+2*Q), new THREE.MeshBasicMaterial({color:th.ground}));
  ground.rotation.x = -Math.PI/2; group.add(ground);
  const geo = new THREE.BoxGeometry(1,1,1); geo.translate(0,0.5,0);
  const topMat = new THREE.MeshBasicMaterial({color:th.top}); // unlit: top-down contrast never depends on lighting
  const sideMats = th.side.map(c=>new THREE.MeshLambertMaterial({color:c}));
  for (let y=0;y<N;y++) for (let x=0;x<N;x++) if (m[y][x]==="1"){
    const s = sideMats[Math.floor(hash(y,x)*sideMats.length)];
    const b = new THREE.Mesh(geo, [s,s,topMat,s,s,s]);
    b.position.set(x-N/2+0.5, 0, y-N/2+0.5);
    b.userData = {x,y}; group.add(b); blocks.push(b);
  }
  document.getElementById("label").textContent = CODES[codeIdx].name;
  hud();
}
function hud(){
  document.getElementById("hud").innerHTML =
    `<b>${CODES[codeIdx].name}</b> · ${THEMES[themeIdx].name} — Space reveal · 1-${CODES.length} link · T theme · drag to orbit · H hide · F fullscreen`;
}

// orbit (3D view only)
let yaw = 0.7, pitch = 0.62, drag = null;
addEventListener("pointerdown", e=>drag={x:e.clientX,y:e.clientY});
addEventListener("pointerup", ()=>drag=null);
addEventListener("pointermove", e=>{ if(!drag||target) return;
  yaw -= (e.clientX-drag.x)*0.005; pitch = Math.min(1.4, Math.max(0.2, pitch+(e.clientY-drag.y)*0.004)); drag={x:e.clientX,y:e.clientY}; });
addEventListener("keydown", e=>{
  if (e.key===" ") { target = target?0:1; e.preventDefault(); }
  else if (/^[1-9]$/.test(e.key) && +e.key<=CODES.length) { codeIdx=+e.key-1; build(); }
  else if (e.key==="t"||e.key==="T") { themeIdx=(themeIdx+1)%THEMES.length; build(); }
  else if (e.key==="h"||e.key==="H") document.body.classList.toggle("clean");
  else if (e.key==="f"||e.key==="F") document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
});
addEventListener("resize", ()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; });
// slideshow hook: parent deck can postMessage("reveal") / ("unreveal")
addEventListener("message", e=>{ if(e.data==="reveal") target=1; if(e.data==="unreveal") target=0; });

const ease = t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let last = performance.now(), t0 = 0;
function frame(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now; t0 += dt;
  reveal += Math.sign(target-reveal)*Math.min(Math.abs(target-reveal), dt/2.6);
  const r = ease(reveal), th = THEMES[themeIdx];
  // heights: animate while 3D, freeze toward the end (they stay tall; the camera does the work)
  for (const b of blocks) b.scale.y = th.h(b.userData.x, b.userData.y, N, th.idle ? t0*(1-r) : 0);
  if (!target) yaw += dt*0.06*(1-r);
  // dolly-zoom: as we reveal, the camera backs away and narrows its lens so the top view is near-orthographic
  const span = N + 8, fit = span*0.5/Math.min(1, camera.aspect);
  const fov = THREE.MathUtils.lerp(40, 0.6, r);
  const dist = fit/Math.tan(THREE.MathUtils.degToRad(fov/2)) * THREE.MathUtils.lerp(1.15, 1.0, r);
  const p = THREE.MathUtils.lerp(pitch, Math.PI/2 - 1e-4, r);
  const yw = THREE.MathUtils.lerp(yaw, Math.round(yaw/(Math.PI*2))*Math.PI*2, r);
  camera.fov = fov; camera.far = dist*2+100; camera.near = Math.max(0.1, dist-200);
  camera.position.set(Math.sin(yw)*Math.cos(p)*dist, Math.sin(p)*dist, Math.cos(yw)*Math.cos(p)*dist);
  camera.up.set(-Math.sin(yw), 0, -Math.cos(yw)).lerp(new THREE.Vector3(0,1,0), 1-r).normalize();
  camera.lookAt(0, 0, 0); camera.updateProjectionMatrix();
  if (showLabel) document.getElementById("label").style.opacity = r>0.98 ? 1 : 0;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
build(); requestAnimationFrame(frame);
</script>
</body>
</html>
