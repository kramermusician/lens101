<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cube Lens</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:-apple-system,Helvetica,sans-serif;color:#f4ecd8}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw;max-height:100vh}
  video{display:none}
  #hud{position:fixed;left:16px;bottom:16px;background:rgba(20,20,20,.72);padding:12px 16px;border-radius:12px;font-size:15px;line-height:1.5;max-width:46vw}
  #hud b{color:#ffd166;font-weight:600}
  #modes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  #modes span{padding:3px 8px;border-radius:8px;background:#2a2a2a;cursor:pointer;font-size:13px}
  #modes span.on{background:#ffd166;color:#111}
  #status{position:fixed;top:16px;left:16px;font-size:14px;background:rgba(20,20,20,.6);padding:6px 10px;border-radius:8px}
  #modeName{position:fixed;top:16px;right:16px;font-size:28px;font-weight:600;background:rgba(20,20,20,.6);padding:8px 16px;border-radius:12px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<video id="v" playsinline muted></video>
<div id="status">loading MediaPipe…</div>
<div id="modeName"></div>
<div id="hud">
  Hold the cube up. <b>←/→</b> or <b>1-9, 0, Q-T</b> switch modes · <b>Space</b> auto-cycle · <b>D</b> debug · <b>H</b> hide this · <b>M</b> sound on/off
  <div id="modes"></div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById('v');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const statusEl = document.getElementById('status');
const modeNameEl = document.getElementById('modeName');

// ---------- small analysis canvas for cube finding ----------
const AW = 192, AH = 108;
const ac = document.createElement('canvas'); ac.width = AW; ac.height = AH;
const actx = ac.getContext('2d', { willReadFrequently: true });
// scratch canvas for effects
const sc = document.createElement('canvas');
const sctx = sc.getContext('2d');

let W = 1280, H = 720;
let hands = [];
let debug = false;
let soundOn = false;
let t0 = performance.now();

// Cube state, in full-frame pixels: center, half-size, angle, velocity, confidence 0..1
const cube = { x: 0, y: 0, s: 0, a: 0, vx: 0, vy: 0, conf: 0, seen: false, colors: Array(9).fill('#888'), names: Array(9).fill('?') };

// ---------- sticker colour classification ----------
const PALETTE = [
  { n: 'red',    zh: '红', c: '#e8323c' },
  { n: 'orange', zh: '橙', c: '#ff8a1f' },
  { n: 'yellow', zh: '黄', c: '#ffd60a' },
  { n: 'green',  zh: '绿', c: '#2bb24c' },
  { n: 'blue',   zh: '蓝', c: '#1f6fe0' },
  { n: 'white',  zh: '白', c: '#f2f2f2' },
];
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, mx ? d / mx : 0, mx];
}
function classify(r, g, b) {
  const [h, s, v] = rgb2hsv(r, g, b);
  if (s < 0.28 && v > 0.55) return 5;
  if (h < 12 || h >= 330) return 0;
  if (h < 38) return 1;
  if (h < 70) return 2;
  if (h < 165) return 3;
  if (h < 260) return 4;
  return 0;
}
// A pixel that looks like a sticker: strongly saturated colour (white stickers are too common in rooms, so they only count next to coloured ones)
function isSticker(r, g, b) {
  const [h, s, v] = rgb2hsv(r, g, b);
  if (v < 0.28) return false;
  if (s < 0.45) return false;
  // skin tones: orange-ish hue, mid saturation. Reject the softer ones.
  if (h > 5 && h < 35 && s < 0.62) return false;
  return true;
}

// ---------- cube finder: saturated blob near the hands ----------
const CELL = 4, GW = AW / CELL, GH = AH / CELL;
const cells = new Uint8Array(GW * GH);
const lab = new Int32Array(GW * GH);
function findCube() {
  actx.save(); actx.scale(-1, 1); actx.drawImage(video, -AW, 0, AW, AH); actx.restore();
  const px = actx.getImageData(0, 0, AW, AH).data;
  cells.fill(0);
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
    let n = 0;
    for (let y = 0; y < CELL; y += 2) for (let x = 0; x < CELL; x += 2) {
      const i = ((gy * CELL + y) * AW + gx * CELL + x) * 4;
      if (isSticker(px[i], px[i + 1], px[i + 2])) n++;
    }
    if (n >= 2) cells[gy * GW + gx] = 1;
  }
  // hand region of interest (in grid units)
  let roi = null;
  if (hands.length) {
    let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
    for (const h of hands) for (const p of h) { const x = 1 - p.x; x0 = Math.min(x0, x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, x); y1 = Math.max(y1, p.y); }
    const pad = 0.12;
    roi = [(x0 - pad) * GW, (y0 - pad) * GH, (x1 + pad) * GW, (y1 + pad) * GH];
  }
  // close small gaps between stickers (black plastic lines): dilate once
  const dil = new Uint8Array(cells);
  for (let gy = 1; gy < GH - 1; gy++) for (let gx = 1; gx < GW - 1; gx++) {
    if (cells[gy * GW + gx]) continue;
    let n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) n += cells[(gy + dy) * GW + gx + dx];
    if (n >= 3) dil[gy * GW + gx] = 1;
  }
  // connected components
  lab.fill(0);
  let best = null, id = 0;
  const stack = [];
  for (let s0 = 0; s0 < GW * GH; s0++) {
    if (!dil[s0] || lab[s0]) continue;
    id++; stack.push(s0); lab[s0] = id;
    let n = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, minx = 1e9, maxx = -1, miny = 1e9, maxy = -1;
    while (stack.length) {
      const k = stack.pop(); const x = k % GW, y = (k / GW) | 0;
      n++; sx += x; sy += y; sxx += x * x; syy += y * y; sxy += x * y;
      if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
      const nb = [k - 1, k + 1, k - GW, k + GW];
      for (const q of nb) if (q >= 0 && q < GW * GH && dil[q] && !lab[q] && Math.abs((q % GW) - x) <= 1) { lab[q] = id; stack.push(q); }
    }
    if (n < 6) continue;
    const cx = sx / n, cy = sy / n;
    const bw = maxx - minx + 1, bh = maxy - miny + 1;
    const fill = n / (bw * bh), aspect = Math.min(bw, bh) / Math.max(bw, bh);
    let score = n * (0.4 + fill) * (0.3 + aspect);
    if (roi) {
      const inside = cx > roi[0] && cx < roi[2] && cy > roi[1] && cy < roi[3];
      score *= inside ? 3 : 0.25;
    }
    if (cube.seen) { // stick with what we had
      const d = Math.hypot(cx - cube.x / W * GW, cy - cube.y / H * GH);
      score *= 1 + 2 / (1 + d / 4);
    }
    if (!best || score > best.score) best = { score, n, cx, cy, sxx: sxx / n - cx * cx, syy: syy / n - cy * cy, sxy: sxy / n - cx * cy, bw, bh };
  }
  const minN = 14;
  if (best && best.n >= minN) {
    // orientation from second moments, folded into 0..90 degrees (a square looks the same every quarter turn)
    let a = 0.5 * Math.atan2(2 * best.sxy, best.sxx - best.syy);
    a = ((a % (Math.PI / 2)) + Math.PI / 2) % (Math.PI / 2);
    if (a > Math.PI / 4) a -= Math.PI / 2;
    const side = Math.sqrt(best.n) * CELL * (W / AW);
    const nx = best.cx * CELL * (W / AW) + CELL / 2 * W / AW, ny = best.cy * CELL * (H / AH) + CELL / 2 * H / AH;
    const k = cube.seen ? 0.35 : 1;
    const px0 = cube.x, py0 = cube.y;
    cube.x += (nx - cube.x) * k; cube.y += (ny - cube.y) * k;
    cube.s += (side / 2 - cube.s) * k;
    let da = a - cube.a; while (da > Math.PI / 4) da -= Math.PI / 2; while (da < -Math.PI / 4) da += Math.PI / 2;
    cube.a += da * (cube.seen ? 0.25 : 1);
    cube.vx = cube.vx * 0.6 + (cube.x - px0) * 0.4; cube.vy = cube.vy * 0.6 + (cube.y - py0) * 0.4;
    cube.conf = Math.min(1, cube.conf + 0.15);
    cube.seen = true;
    readFace(px);
  } else {
    cube.conf = Math.max(0, cube.conf - 0.06);
    if (cube.conf === 0) cube.seen = false;
    cube.vx *= 0.8; cube.vy *= 0.8;
  }
}
function facePoint(i, j, inset = 1) { // i,j in -1..1 grid, returns frame px
  const s = cube.s * inset, ca = Math.cos(cube.a), sa = Math.sin(cube.a);
  const u = i * s * 2 / 3, v = j * s * 2 / 3;
  return [cube.x + u * ca - v * sa, cube.y + u * sa + v * ca];
}
function readFace(px) {
  let k = 0;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const [fx, fy] = facePoint(i, j);
    const ax = Math.round(fx / W * AW), ay = Math.round(fy / H * AH);
    let r = 0, g = 0, b = 0, n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = ax + dx, y = ay + dy; if (x < 0 || y < 0 || x >= AW || y >= AH) continue;
      const q = (y * AW + x) * 4; r += px[q]; g += px[q + 1]; b += px[q + 2]; n++;
    }
    if (n) { const c = classify(r / n, g / n, b / n); cube.colors[k] = PALETTE[c].c; cube.names[k] = c; }
    k++;
  }
}

// ---------- helpers ----------
function cubePath(c, inset = 1) {
  const s = cube.s * inset, ca = Math.cos(cube.a), sa = Math.sin(cube.a);
  c.beginPath();
  for (const [u, v] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) c.lineTo(cube.x + (u * ca - v * sa) * s, cube.y + (u * sa + v * ca) * s);
  c.closePath();
}
function withCube(fn) { ctx.save(); ctx.translate(cube.x, cube.y); ctx.rotate(cube.a); fn(cube.s); ctx.restore(); }
const T = () => (performance.now() - t0) / 1000;
const rand = (a, b) => a + Math.random() * (b - a);
const particles = [];
function spawn(p) { if (particles.length < 900) particles.push(p); }
function stepParticles(draw) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g || 0; p.vx *= p.drag || 1; p.vy *= p.drag || 1; p.life -= 1;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    draw(p);
  }
}
function drawVideo() { ctx.save(); ctx.scale(-1, 1); ctx.drawImage(video, -W, 0, W, H); ctx.restore(); }
const speed = () => Math.hypot(cube.vx, cube.vy);

// ---------- audio ----------
let actxA = null;
function tone(freq, dur = 0.25, type = 'triangle', vol = 0.12) {
  if (!soundOn) return;
  actxA = actxA || new AudioContext();
  const o = actxA.createOscillator(), g = actxA.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actxA.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actxA.currentTime + dur);
  o.connect(g).connect(actxA.destination); o.start(); o.stop(actxA.currentTime + dur);
}

// ---------- modes ----------
const MODES = [];
const mode = (key, name, draw, opts = {}) => MODES.push({ key, name, draw, ...opts });

mode('1', 'Neon Grid', () => {
  const t = T();
  ctx.lineWidth = 4; ctx.shadowBlur = 25; ctx.shadowColor = '#00fff0'; ctx.strokeStyle = `hsl(${(t * 60) % 360},100%,65%)`;
  cubePath(ctx, 1.08); ctx.stroke();
  withCube(s => {
    ctx.beginPath();
    for (const k of [-1 / 3, 1 / 3]) { ctx.moveTo(k * s * 2, -s); ctx.lineTo(k * s * 2, s); ctx.moveTo(-s, k * s * 2); ctx.lineTo(s, k * s * 2); }
    ctx.lineWidth = 2; ctx.stroke();
    const sc2 = 1.15 + 0.1 * Math.sin(t * 4);
    ctx.globalAlpha = 0.5; ctx.strokeRect(-s * sc2, -s * sc2, s * 2 * sc2, s * 2 * sc2); ctx.globalAlpha = 1;
  });
  ctx.shadowBlur = 0;
});

mode('2', 'Colour Reader', () => {
  withCube(s => {
    const cs = s * 2 / 3;
    let k = 0;
    ctx.font = `${Math.max(12, cs * 0.28)}px -apple-system,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      ctx.fillStyle = cube.colors[k]; ctx.globalAlpha = 0.85;
      ctx.fillRect(i * cs - cs * 0.42, j * cs - cs * 0.42, cs * 0.84, cs * 0.84);
      ctx.globalAlpha = 1; ctx.fillStyle = '#111';
      ctx.fillText(PALETTE[cube.names[k]]?.n || '?', i * cs, j * cs);
      k++;
    }
  });
  // tally panel
  const counts = Array(6).fill(0); cube.names.forEach(n => counts[n]++);
  const x = cube.x + cube.s * 1.4, y = cube.y - cube.s;
  ctx.fillStyle = 'rgba(20,20,20,.75)'; ctx.fillRect(x, y, 170, 6 * 30 + 16);
  ctx.font = '20px -apple-system,sans-serif'; ctx.textAlign = 'left';
  PALETTE.forEach((p, i) => { ctx.fillStyle = p.c; ctx.fillRect(x + 10, y + 12 + i * 30, 20, 20); ctx.fillStyle = '#f4ecd8'; ctx.fillText(`${p.n} × ${counts[i]}`, x + 40, y + 28 + i * 30); });
});

mode('3', '汉字 Stickers', () => {
  withCube(s => {
    const cs = s * 2 / 3; let k = 0;
    ctx.font = `bold ${cs * 0.7}px "PingFang SC","Heiti SC",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      const p = PALETTE[cube.names[k++]] || PALETTE[5];
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(i * cs - cs * 0.45, j * cs - cs * 0.45, cs * 0.9, cs * 0.9);
      ctx.fillStyle = p.c; ctx.fillText(p.zh, i * cs, j * cs + cs * 0.04);
    }
  });
  ctx.font = '26px "PingFang SC",sans-serif'; ctx.fillStyle = '#f4ecd8'; ctx.textAlign = 'center';
  ctx.fillText('红 hóng · 橙 chéng · 黄 huáng · 绿 lǜ · 蓝 lán · 白 bái', W / 2, H - 30);
});

mode('4', 'Portal', () => {
  // inside the cube: a tunnel of zoomed-in copies of the room, spinning
  const t = T();
  ctx.save(); cubePath(ctx, 1.05); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (let d = 0; d < 8; d++) {
    const f = ((d + (t * 0.8) % 1) / 8);
    const sz = cube.s * 2.1 * (1 - f);
    ctx.save(); ctx.translate(cube.x, cube.y); ctx.rotate(cube.a + f * 3 + t * 0.3);
    ctx.globalAlpha = 1 - f * 0.8;
    ctx.scale(-1, 1);
    ctx.drawImage(video, (W - (cube.x)) - sz * 1.5, cube.y - sz * 1.5, sz * 3, sz * 3, -sz / 2, -sz / 2, sz, sz);
    ctx.restore();
    ctx.strokeStyle = `hsla(${d * 45 + t * 90},100%,60%,${1 - f})`; ctx.lineWidth = 3;
    withCube(() => { ctx.rotate(f * 3 + t * 0.3); ctx.strokeRect(-sz / 2, -sz / 2, sz, sz); });
  }
  ctx.restore();
  ctx.strokeStyle = '#b388ff'; ctx.lineWidth = 6; ctx.shadowBlur = 30; ctx.shadowColor = '#b388ff'; cubePath(ctx, 1.05); ctx.stroke(); ctx.shadowBlur = 0;
});

mode('5', 'Fire Cube', () => {
  for (let i = 0; i < 8; i++) {
    const [x, y] = facePoint(rand(-1.4, 1.4), -1.5);
    spawn({ x, y, vx: rand(-1, 1) - cube.vx * 0.2, vy: rand(-6, -2), life: rand(25, 45), max: 45, r: rand(8, 22), g: -0.05 });
  }
  ctx.globalCompositeOperation = 'lighter';
  stepParticles(p => {
    const f = p.life / p.max;
    ctx.fillStyle = `hsla(${15 + 40 * f},100%,${40 + 30 * f}%,${f * 0.6})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + f), 0, 7); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
});

mode('6', 'Solar System', () => {
  const t = T();
  ctx.fillStyle = 'rgba(255,200,60,.25)'; ctx.beginPath(); ctx.arc(cube.x, cube.y, cube.s * 1.6, 0, 7); ctx.fill();
  const planets = [[1.9, 0.9, 10, '#9be7ff'], [2.6, 0.55, 16, '#ff8a65'], [3.4, 0.35, 22, '#ffd54f'], [4.3, 0.22, 13, '#a5d6a7'], [5.2, 0.15, 9, '#ce93d8']];
  for (const [r, w, sz, col] of planets) {
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(cube.x, cube.y, cube.s * r, cube.s * r * 0.45, cube.a, 0, 7); ctx.stroke();
    const th = t * w * 2 + r;
    const ex = Math.cos(th) * cube.s * r, ey = Math.sin(th) * cube.s * r * 0.45;
    const x = cube.x + ex * Math.cos(cube.a) - ey * Math.sin(cube.a), y = cube.y + ex * Math.sin(cube.a) + ey * Math.cos(cube.a);
    ctx.fillStyle = col; ctx.shadowBlur = 20; ctx.shadowColor = col;
    ctx.beginPath(); ctx.arc(x, y, sz * cube.s / 80, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  }
});

mode('7', 'Hologram 3D', () => {
  // a translucent 3D cube floating above, turning with the real one plus a slow spin
  const t = T(), s = cube.s * 1.1, cx = cube.x, cy = cube.y - cube.s * 2.6;
  const ry = t * 0.8, rx = 0.5 + cube.vy * 0.02, rz = cube.a;
  const P = [];
  for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) {
    let X = x, Y = y, Z = z, q;
    q = X * Math.cos(ry) + Z * Math.sin(ry); Z = -X * Math.sin(ry) + Z * Math.cos(ry); X = q;
    q = Y * Math.cos(rx) - Z * Math.sin(rx); Z = Y * Math.sin(rx) + Z * Math.cos(rx); Y = q;
    q = X * Math.cos(rz) - Y * Math.sin(rz); Y = X * Math.sin(rz) + Y * Math.cos(rz); X = q;
    const f = 4 / (4 + Z); P.push([cx + X * s * f, cy + Y * s * f]);
  }
  const E = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];
  ctx.strokeStyle = '#4dd0e1'; ctx.lineWidth = 3; ctx.shadowBlur = 18; ctx.shadowColor = '#4dd0e1';
  ctx.beginPath(); for (const [a, b] of E) { ctx.moveTo(...P[a]); ctx.lineTo(...P[b]); } ctx.stroke();
  ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.moveTo(cx - s, cube.y - cube.s); ctx.lineTo(cx + s, cube.y - cube.s); ctx.lineTo(cx + s * 0.4, cy + s); ctx.lineTo(cx - s * 0.4, cy + s); ctx.fillStyle = '#4dd0e1'; ctx.fill();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  // scanlines over real cube
  ctx.save(); cubePath(ctx); ctx.clip(); ctx.fillStyle = 'rgba(77,208,225,.25)';
  for (let y = 0; y < H; y += 6) ctx.fillRect(0, y + (t * 30) % 6, W, 2);
  ctx.restore();
});

mode('8', 'Sticker Burst', () => {
  if (speed() > 6 || Math.random() < 0.08) {
    for (let k = 0; k < 9; k++) {
      const [x, y] = facePoint((k % 3) - 1, ((k / 3) | 0) - 1);
      const ang = rand(0, 7), sp = rand(3, 9) + speed() * 0.4;
      spawn({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, g: 0.25, life: 60, max: 60, col: cube.colors[k], rot: rand(0, 6), vr: rand(-0.3, 0.3) });
    }
  }
  stepParticles(p => {
    p.rot += p.vr; const s = cube.s / 3.4;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.col; ctx.fillRect(-s / 2, -s / 2, s, s); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(-s / 2, -s / 2, s, s);
    ctx.restore();
  });
});

const trail = [];
mode('9', 'Ghost Trail', () => {
  // stamp copies of the cube region along its path
  sc.width = Math.max(2, (cube.s * 2.2) | 0); sc.height = sc.width;
  sctx.save(); sctx.scale(-1, 1);
  sctx.drawImage(video, W - cube.x - cube.s * 1.1, cube.y - cube.s * 1.1, cube.s * 2.2, cube.s * 2.2, -sc.width, 0, sc.width, sc.height);
  sctx.restore();
  const snap = document.createElement('canvas'); snap.width = sc.width; snap.height = sc.height; snap.getContext('2d').drawImage(sc, 0, 0);
  trail.push({ img: snap, x: cube.x, y: cube.y, a: cube.a });
  if (trail.length > 24) trail.shift();
  trail.forEach((g, i) => {
    const f = i / trail.length;
    ctx.save(); ctx.globalAlpha = f * 0.5; ctx.translate(g.x, g.y); ctx.filter = `hue-rotate(${(1 - f) * 240}deg)`;
    ctx.drawImage(g.img, -g.img.width / 2, -g.img.height / 2); ctx.restore();
  });
  ctx.filter = 'none';
}, { reset: () => trail.length = 0 });

mode('0', 'Kaleidoscope', () => {
  // the cube region mirrored into a ring of 8 wedges around it
  const R = cube.s * 3.2, n = 8;
  sc.width = sc.height = Math.max(2, (cube.s * 2) | 0);
  sctx.save(); sctx.scale(-1, 1); sctx.drawImage(video, W - cube.x - cube.s, cube.y - cube.s, cube.s * 2, cube.s * 2, -sc.width, 0, sc.width, sc.height); sctx.restore();
  const t = T();
  for (let i = 0; i < n; i++) {
    ctx.save(); ctx.translate(cube.x, cube.y); ctx.rotate(i * Math.PI * 2 / n + t * 0.2);
    if (i % 2) ctx.scale(1, -1);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, -Math.PI / n, Math.PI / n); ctx.closePath(); ctx.clip();
    ctx.drawImage(sc, cube.s * 0.6, -cube.s, cube.s * 2, cube.s * 2);
    ctx.restore();
  }
});

mode('q', 'Black Hole', () => {
  // the room around the cube gets pulled inward in rings
  const t = T();
  for (let r = 6; r >= 1; r--) {
    const rad = cube.s * (1 + r * 0.55);
    ctx.save(); ctx.beginPath(); ctx.arc(cube.x, cube.y, rad, 0, 7); ctx.clip();
    ctx.translate(cube.x, cube.y); ctx.rotate(r * 0.12 * Math.sin(t * 0.7) + r * 0.05); ctx.scale(1 + r * 0.04, 1 + r * 0.04); ctx.translate(-cube.x, -cube.y);
    drawVideo(); ctx.restore();
  }
  const g = ctx.createRadialGradient(cube.x, cube.y, cube.s * 0.4, cube.x, cube.y, cube.s * 1.3);
  g.addColorStop(0, '#000'); g.addColorStop(0.7, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(255,140,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cube.x, cube.y, cube.s * 1.3, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,170,60,.8)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(cube.x, cube.y, cube.s * 2, cube.s * 0.5, t * 0.5, 0, 7); ctx.stroke();
});

mode('w', 'Lightning Hands', () => {
  if (!hands.length) return;
  ctx.strokeStyle = '#d0f4ff'; ctx.shadowBlur = 20; ctx.shadowColor = '#7fdbff'; ctx.lineWidth = 2.5;
  for (const h of hands) for (const tip of [4, 8, 12, 16, 20]) {
    const p = h[tip]; let x = (1 - p.x) * W, y = p.y * H;
    const tx = cube.x, ty = cube.y;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let s = 1; s <= 8; s++) { const f = s / 8; ctx.lineTo(x + (tx - x) * f + rand(-14, 14), y + (ty - y) * f + rand(-14, 14)); }
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(200,240,255,.25)'; cubePath(ctx, 1.1); ctx.fill();
});

mode('e', 'Pixel Giant', () => {
  // magnifier: the cube shown 2.4x next to itself, pixelated
  sc.width = sc.height = 18;
  sctx.save(); sctx.scale(-1, 1); sctx.drawImage(video, W - cube.x - cube.s, cube.y - cube.s, cube.s * 2, cube.s * 2, -18, 0, 18, 18); sctx.restore();
  ctx.imageSmoothingEnabled = false;
  const S = cube.s * 2.4, x = cube.x > W / 2 ? cube.x - cube.s * 1.5 - S * 2 : cube.x + cube.s * 1.5;
  ctx.drawImage(sc, x, cube.y - S, S * 2, S * 2);
  ctx.imageSmoothingEnabled = true;
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 4; ctx.strokeRect(x, cube.y - S, S * 2, S * 2);
  ctx.beginPath(); ctx.moveTo(cube.x, cube.y); ctx.lineTo(x + (x > cube.x ? 0 : S * 2), cube.y); ctx.stroke();
});

let lastNote = 0;
mode('r', 'Cube Theremin', () => {
  // height = pitch on a pentatonic scale, sticker count of the top colour = chord colour
  const steps = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  const idx = Math.max(0, Math.min(steps.length - 1, Math.round((1 - cube.y / H) * (steps.length - 1))));
  const f = 220 * Math.pow(2, steps[idx] / 12);
  const now = performance.now();
  if (now - lastNote > 260) { lastNote = now; tone(f, 0.4, cube.x < W / 2 ? 'triangle' : 'sawtooth', 0.08); spawn({ x: cube.x, y: cube.y, vx: 0, vy: 0, life: 40, max: 40, ring: true }); }
  for (let i = 0; i < steps.length; i++) {
    const y = H - (i / (steps.length - 1)) * H;
    ctx.fillStyle = i === idx ? 'rgba(255,209,102,.5)' : 'rgba(255,255,255,.08)'; ctx.fillRect(0, y - 2, W, 4);
  }
  stepParticles(p => { const k = 1 - p.life / p.max; ctx.strokeStyle = `rgba(255,209,102,${1 - k})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, cube.s * (1 + k * 3), 0, 7); ctx.stroke(); });
  ctx.fillStyle = '#ffd166'; ctx.font = '22px -apple-system,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(soundOn ? 'move the cube up and down · left = soft, right = buzzy' : 'press M to turn sound on', W / 2, 40);
});

mode('t', 'Invisible Cube', () => {
  // hide the cube by painting a stretched patch of the room from just beside it, plus a shimmer edge
  sc.width = sc.height = 64;
  sctx.save(); sctx.scale(-1, 1);
  const off = cube.s * 2.3, sx = cube.x + (cube.x < W / 2 ? off : -off);
  sctx.drawImage(video, W - sx - cube.s, cube.y - cube.s, cube.s * 2, cube.s * 2, -64, 0, 64, 64); sctx.restore();
  ctx.save(); cubePath(ctx, 1.15); ctx.clip(); ctx.drawImage(sc, cube.x - cube.s * 1.2, cube.y - cube.s * 1.2, cube.s * 2.4, cube.s * 2.4); ctx.restore();
  ctx.strokeStyle = `rgba(200,230,255,${0.25 + 0.2 * Math.sin(T() * 6)})`; ctx.lineWidth = 2; cubePath(ctx, 1.15); ctx.stroke();
});

mode('y', 'Rainbow Face', () => {
  // each sticker becomes a slowly cycling colour while keeping the cube's light and shadow
  const t = T();
  withCube(s => {
    const cs = s * 2 / 3;
    ctx.globalCompositeOperation = 'color';
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      ctx.fillStyle = `hsl(${(t * 50 + (i + j + 2) * 40) % 360},90%,55%)`;
      ctx.fillRect(i * cs - cs / 2, j * cs - cs / 2, cs, cs);
    }
    ctx.globalCompositeOperation = 'source-over';
  });
});

mode('u', 'Constellation', () => {
  // the nine stickers become stars, linked to every fingertip
  const stars = [];
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) stars.push(facePoint(i * 1.5, j * 1.5));
  ctx.fillStyle = 'rgba(5,10,30,.55)'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(180,200,255,.5)'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let a = 0; a < 9; a++) for (let b = a + 1; b < 9; b++) if ((a + b + Math.floor(T())) % 4 === 0) { ctx.moveTo(...stars[a]); ctx.lineTo(...stars[b]); }
  for (const h of hands) for (const tip of [4, 8, 12, 16, 20]) { const p = h[tip]; const s = stars[tip % 9]; ctx.moveTo((1 - p.x) * W, p.y * H); ctx.lineTo(...s); }
  ctx.stroke();
  stars.forEach((s, k) => { ctx.fillStyle = cube.colors[k]; ctx.shadowBlur = 20; ctx.shadowColor = cube.colors[k]; ctx.beginPath(); ctx.arc(s[0], s[1], 6 + 3 * Math.sin(T() * 3 + k), 0, 7); ctx.fill(); });
  ctx.shadowBlur = 0;
});

// ---------- UI ----------
let cur = 0, auto = false, autoAt = 0;
const modesEl = document.getElementById('modes');
MODES.forEach((m, i) => { const s = document.createElement('span'); s.textContent = `${m.key.toUpperCase()} ${m.name}`; s.onclick = () => setMode(i); modesEl.appendChild(s); });
function setMode(i) {
  cur = (i + MODES.length) % MODES.length; particles.length = 0; MODES[cur].reset?.();
  [...modesEl.children].forEach((c, k) => c.classList.toggle('on', k === cur));
  modeNameEl.textContent = MODES[cur].name;
}
setMode(0);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const i = MODES.findIndex(m => m.key === k);
  if (i >= 0) setMode(i);
  else if (k === 'arrowright') setMode(cur + 1);
  else if (k === 'arrowleft') setMode(cur - 1);
  else if (k === ' ') { auto = !auto; autoAt = performance.now(); statusEl.textContent = auto ? 'auto-cycle on' : 'auto-cycle off'; }
  else if (k === 'd') debug = !debug;
  else if (k === 'h') { document.getElementById('hud').classList.toggle('hidden'); modeNameEl.classList.toggle('hidden'); }
  else if (k === 'm') { soundOn = !soundOn; tone(440, 0.2); statusEl.textContent = soundOn ? 'sound on' : 'sound off'; }
  else if (k === 'f') document.documentElement.requestFullscreen?.();
});

// ---------- main ----------
async function main() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
  video.srcObject = stream; await video.play();
  W = cv.width = video.videoWidth; H = cv.height = video.videoHeight;
  let landmarker = null;
  try {
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
      runningMode: "VIDEO", numHands: 2,
    });
    statusEl.textContent = 'MediaPipe hands ready · hold up the cube';
  } catch (e) {
    console.warn(e); statusEl.textContent = 'hand model failed to load, colour tracking only';
  }
  let lastVT = -1;
  function frame() {
    const now = performance.now();
    if (landmarker && video.currentTime !== lastVT) { lastVT = video.currentTime; hands = landmarker.detectForVideo(video, now).landmarks || []; }
    findCube();
    drawVideo();
    if (cube.seen) {
      ctx.save(); ctx.globalAlpha = 1; MODES[cur].draw(); ctx.restore();
    } else if (particles.length) stepParticles(() => {});
    if (debug) {
      ctx.drawImage(ac, 0, 0, AW * 2, AH * 2);
      ctx.fillStyle = 'rgba(0,255,0,.5)';
      for (let k = 0; k < GW * GH; k++) if (cells[k]) ctx.fillRect((k % GW) * CELL * 2, ((k / GW) | 0) * CELL * 2, CELL * 2, CELL * 2);
      for (const h of hands) for (const p of h) { ctx.fillStyle = '#0f0'; ctx.fillRect((1 - p.x) * W - 3, p.y * H - 3, 6, 6); }
      ctx.strokeStyle = '#0f0'; ctx.lineWidth = 2; cubePath(ctx); ctx.stroke();
      ctx.fillStyle = '#0f0'; ctx.font = '16px monospace'; ctx.fillText(`conf ${cube.conf.toFixed(2)} size ${cube.s.toFixed(0)} hands ${hands.length}`, 10, AH * 2 + 20);
    }
    if (!cube.seen && !debug) {
      ctx.fillStyle = 'rgba(244,236,216,.8)'; ctx.font = '24px -apple-system,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('hold the cube up to the camera, coloured side facing it', W / 2, H - 40);
    }
    if (auto && now - autoAt > 12000) { autoAt = now; setMode(cur + 1); }
    requestAnimationFrame(frame);
  }
  frame();
}
main().catch(e => { statusEl.textContent = 'camera error: ' + e.message; });
</script>
</body>
</html>
