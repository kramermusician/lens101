<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polyglot Word Web</title>
<style>
  :root {
    --bg: #1b1d23; --panel: #23262e; --panel2: #2b2f39; --line: #3a3f4b;
    --text: #e6e3da; --dim: #9a9faa; --accent: #c9a86a;
    --verb: #8fb8de; --noun: #9fcf9a; --adj: #e0b97a; --adv: #c9a0dc; --expr: #e39a9a;
    --near: #7fa7c9; --opposite: #d98b8b; --family: #8fc490; --theme: #b9a3d6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 1fr 430px; grid-template-rows: auto 1fr; height: 100%; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .02em; white-space: nowrap; }
  header h1 span { color: var(--accent); }
  #searchWrap { position: relative; flex: 1; max-width: 520px; }
  #search { width: 100%; padding: 9px 12px; font-size: 17px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; outline: none; }
  #search:focus { border-color: var(--accent); }
  #suggest { position: absolute; left: 0; right: 0; top: 44px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; max-height: 380px; overflow: auto; z-index: 20; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  #suggest div { padding: 7px 12px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  #suggest div.on, #suggest div:hover { background: #363b48; }
  #suggest b { font-weight: 600; }
  #suggest small { color: var(--dim); }
  #suggest .via { color: var(--accent); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .controls { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  button, .seg button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #1b1d23; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  .seg { display: flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 7px 7px 0; }
  #stats { color: var(--dim); font-size: 12px; white-space: nowrap; }

  #graphWrap { position: relative; min-width: 0; min-height: 0; grid-column: 1; grid-row: 2; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  #legend { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: var(--dim); background: rgba(27,29,35,.82); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); line-height: 1.7; }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 5px 0 0; }
  #legend u { display: inline-block; width: 16px; height: 0; border-top: 2px solid; margin: 0 5px 3px 0; text-decoration: none; }
  #legend span { margin-right: 11px; white-space: nowrap; }
  #hint { position: absolute; right: 14px; bottom: 12px; font-size: 12px; color: var(--dim); }
  #depthWrap { position: absolute; left: 14px; top: 12px; font-size: 12px; color: var(--dim); display: flex; gap: 8px; align-items: center; background: rgba(27,29,35,.82); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); }

  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 18px 40px; min-height: 0; grid-column: 2; grid-row: 2; }
  aside h2 { font-size: 30px; margin: 0; font-weight: 650; line-height: 1.15; }
  .gloss { font-size: 17px; color: var(--text); margin: 4px 0 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--line); color: var(--dim); }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin: 20px 0 8px; font-weight: 600; }
  .rel { display: flex; align-items: baseline; gap: 10px; padding: 8px 10px; margin-bottom: 6px; background: var(--panel2); border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; cursor: pointer; }
  .rel:hover { border-color: var(--accent); }
  .rel b { font-size: 17px; font-weight: 600; }
  .rel .g { color: var(--dim); flex: 1; }
  .rel .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .ex { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 2px 0 14px; }
  .ex .t { font-size: 17px; line-height: 1.4; }
  .ex .t mark { background: none; color: var(--accent); font-weight: 600; }
  .ex .en { color: var(--dim); margin-top: 3px; }
  .ex .ref { display: inline-block; margin-top: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); border: 1px solid var(--line); border-radius: 20px; padding: 1px 8px; }
  .also { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 3px 9px; border-radius: 20px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .chip:hover { border-color: var(--accent); }
  .tenses { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .tenses.one { grid-template-columns: minmax(0, 1fr); }
  .tenses.one .wide { grid-column: 1; }
  .tense { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  .tense h4 { margin: 0 0 5px; font-size: 13px; color: var(--accent); font-weight: 600; }
  .tense h4 small { color: var(--dim); font-weight: 400; }
  .tense table { border-collapse: collapse; width: 100%; }
  .tense td { padding: 1px 0; vertical-align: top; }
  .tense td.p { color: var(--dim); padding-right: 6px; white-space: nowrap; width: 1%; }
  .tense td.f { font-weight: 550; }
  .tense .none { color: var(--line); }
  .wide { grid-column: 1 / 3; }
  .note { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .empty { color: var(--dim); margin-top: 30px; }
  .empty kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  details summary { cursor: pointer; color: var(--dim); margin: 14px 0 8px; font-size: 13px; }
  #aboutView { grid-column: 1 / 3; grid-row: 2; z-index: 30; background: var(--bg); overflow-y: auto; min-height: 0; display: none; }
  #aboutView.on { display: block; }
  #aboutView .col { max-width: 780px; margin: 0 auto; padding: 26px 22px 70px; font-size: 16px; line-height: 1.55; }
  #aboutView h2 { font-size: 26px; margin: 0 0 4px; font-weight: 650; }
  #aboutView h2 span { color: var(--accent); }
  #aboutView .lede { color: var(--dim); margin: 0 0 18px; }
  #aboutView h3 { font-size: 13px; margin: 34px 0 12px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  #aboutView h4 { font-size: 17px; margin: 20px 0 4px; font-weight: 600; }
  #aboutView p { margin: 0 0 10px; }
  #aboutView ul { margin: 0 0 10px; padding-left: 20px; }
  #aboutView li { margin-bottom: 5px; }
  #aboutView code, #aboutView kbd { font: 13px ui-monospace, Menlo, monospace; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  #aboutView .try { color: var(--accent); cursor: pointer; border-bottom: 1px dotted var(--accent); }
  #aboutView .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
  #aboutView .num { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  #aboutView .num b { display: block; font-size: 24px; font-weight: 650; }
  #aboutView .num small { color: var(--dim); }
  #aboutView .pipe { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; margin: 14px 0; }
  #aboutView .pipe div { flex: 1; min-width: 140px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 14px; }
  #aboutView .pipe div b { display: block; font: 600 13px ui-monospace, Menlo, monospace; color: var(--accent); margin-bottom: 3px; }
  #aboutView .pipe span { align-self: center; color: var(--dim); }
  #aboutView .key i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  #aboutView .key u { display: inline-block; width: 18px; border-top: 3px solid; margin: 0 6px 4px 0; text-decoration: none; }
  #aboutView .key span { margin-right: 14px; white-space: nowrap; }
  #aboutView .soft { color: var(--dim); font-size: 14px; }
  /* Polyglot additions */
  :root { --t1: #e08a8a; --t2: #e2b366; --t3: #8fc98d; --t4: #82aee0; --t5: #8d929c; }
  body.lang-ko { font-family: -apple-system, "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", Arial, sans-serif; }
  body.lang-zh { font-family: -apple-system, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; }
  .w-ko { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .w-zh { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  body.lang-ja { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Arial, sans-serif; }
  .w-ja { font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  /* Serbian (Latin and Cyrillic) and Greek use the Latin stack on body */
  #langs button { padding: 6px 9px; }
  #langs button[data-l="ko"], #langs button[data-l="zh"], #langs button[data-l="ja"] { font-size: 14px; }
  /* the Serbian button switches scripts, so it leaves the other languages' romanization in the Same word in row alone */
  body.nosec:not(.lang-sr) .sec { display: none !important; }
  .headsec { font-size: 17px; color: var(--dim); margin: 2px 0 0; letter-spacing: .02em; }
  .headsec.py { font-size: 20px; letter-spacing: .03em; }
  aside h2 small.tr { font-size: 18px; color: var(--dim); font-weight: 500; margin-left: 6px; }
  .t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); } .t5 { color: var(--t5); }
  small.sm { color: var(--dim); font-size: 12px; white-space: nowrap; }
  #suggest .addRow { color: var(--accent); border-top: 1px solid var(--line); }
  #suggest .addRow:first-child { border-top: 0; border-bottom: 1px solid var(--line); }
  #suggest .addRow .plus { font-weight: 700; }
  #suggest .addRow b { color: var(--text); }
  #addStatus { position: absolute; left: 0; right: 0; top: 44px; z-index: 19; display: none; font-size: 13px; }
  #addStatus div { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  #addStatus div.ok { border-left-color: var(--noun); }
  #addStatus div.bad { border-left-color: var(--expr); }
  #addStatus div.busy { animation: pwwPulse 2s ease-in-out infinite; }
  @keyframes pwwPulse { 50% { border-left-color: var(--panel2); } }
  #addStatus button { font-size: 12px; padding: 2px 8px; margin-left: 6px; }
  #suggest small.sm { color: var(--accent); opacity: .8; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--accent); color: var(--accent); }
  .ex .exsec { color: var(--dim); font-size: 14px; margin-top: 3px; }
  .ex .exsec mark { background: none; color: var(--accent); }
  .cross { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -4px 0 14px; }
  .cross .xlabel { font-size: 12px; color: var(--dim); margin-right: 2px; }
  .xchip { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; border-radius: 20px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; font-size: 15px; }
  .xchip:hover { border-color: var(--accent); }
  .xchip i { font-style: normal; font-size: 11px; color: var(--dim); }
  .xchip b { font-weight: 600; }
  .tense.kt td { padding: 2px 0; }
  .tense.kt td.p { padding-right: 12px; }
  .tense.kt td.f { font-size: 16px; padding-right: 12px; }
  .tense.kt td.r { color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
  .mws { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .mw { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; display: inline-flex; gap: 8px; align-items: baseline; }
  .mw b { font-size: 19px; font-weight: 600; }
  .mws .slash { color: var(--dim); }
  .nw { white-space: nowrap; }
  #aboutView .langtab { border-collapse: collapse; width: 100%; margin: 4px 0 10px; font-size: 15px; }
  #aboutView .langtab th { text-align: right; color: var(--dim); font-weight: 500; font-size: 12px; padding: 4px 10px; border-bottom: 1px solid var(--line); }
  #aboutView .langtab td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  #aboutView .langtab td:first-child { text-align: left; }
  #aboutView .langtab td small { color: var(--dim); }
  #aboutView .lname { color: var(--accent); }
  #aboutView h4 small { font-weight: 400; }
  @media (max-width: 1400px) { #stats { display: none; } }
  #searchWrap { min-width: 180px; }
  .headrow { display: flex; align-items: flex-start; gap: 10px; }
  .headrow > div:first-child { flex: 1; min-width: 0; }
  #secToggle { font-size: 12px; padding: 3px 9px; margin-top: 8px; border-radius: 20px; white-space: nowrap; }
  @media (max-width: 900px) {
    #aboutView { grid-column: 1; grid-row: 2 / 4; }
    #app { grid-template-columns: 1fr; grid-template-rows: auto 42vh 1fr; }
    header { grid-column: 1; flex-wrap: wrap; }
    aside { border-left: 0; border-top: 1px solid var(--line); grid-column: 1; grid-row: 3; }
    #stats, #hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Polyglot <span>Word Web</span></h1>
    <div class="seg" id="langs">
      <button data-l="fr" title="French">Français</button><button data-l="es" title="Spanish">Español</button><button data-l="ko" title="Korean">한국어</button><button data-l="zh" title="Chinese">中文</button><button data-l="ja" title="Japanese">日本語</button><button data-l="sr" title="Serbian">Српски</button><button data-l="el" title="Greek">Ελληνικά</button>
    </div>
    <div id="searchWrap">
      <input id="search" type="text" placeholder="" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div id="suggest"></div>
      <div id="addStatus"></div>
    </div>
    <button id="back" title="Back" disabled>&larr;</button>
    <button id="random" title="Jump to a random word">Random</button>
    <div class="controls">
      <span id="stats"></span>
      <div class="seg">
        <button id="modeLocal" class="on">Around this word</button>
        <button id="modeAll">Whole web</button>
      </div>
      <button id="about" title="How this works">About</button>
    </div>
  </header>

  <div id="graphWrap">
    <canvas id="c"></canvas>
    <div id="depthWrap">Steps out
      <div class="seg"><button data-d="1">1</button><button data-d="2" class="on">2</button><button data-d="3">3</button></div>
    </div>
    <div id="legend"></div>
    <div id="hint">click a dot to open it &middot; drag to move &middot; scroll to zoom</div>
  </div>

  <aside id="panel"></aside>
  <div id="aboutView"></div>
</div>

<!-- No libraries and no network. The data files (data/<lang>.js) are added by js/app.js when a language is picked. -->
<script src="js/common.js?v=202611121349"></script>
<script src="js/lang-fr.js?v=202611121349"></script>
<script src="js/lang-es.js?v=202611121349"></script>
<script src="js/lang-ko.js?v=202611121349"></script>
<script src="js/lang-zh.js?v=202611121349"></script>
<script src="js/lang-ja.js?v=202611121349"></script>
<script src="js/lang-sr.js?v=202611121349"></script>
<script src="js/lang-el.js?v=202611121349"></script>
<script src="js/app.js?v=202611121349"></script>
</body>
</html>
