<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The 12 Blocks</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f5f2e9; }
  #stage { display: block; width: 100vw; height: 100vh; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(245, 242, 233, 0.92); cursor: pointer; z-index: 10;
    font-family: Futura, "Helvetica Neue", Arial, sans-serif; color: #163b4e;
    text-align: center; padding: 20px;
  }
  #overlay h1 { margin: 0; font-size: clamp(30px, 6vw, 64px); letter-spacing: 0.14em; font-weight: 500; }
  #overlay p { margin: 0; font-size: clamp(14px, 2vw, 19px); color: #3a5560; letter-spacing: 0.04em; }
  #overlay .play {
    margin-top: 10px; width: 84px; height: 84px; border-radius: 50%;
    border: 3px solid #e23b22; display: flex; align-items: center; justify-content: center;
  }
  #overlay .play::after {
    content: ""; display: block; margin-left: 8px;
    border-left: 26px solid #e23b22; border-top: 16px solid transparent; border-bottom: 16px solid transparent;
  }
  /* The dock never eats more than half the window, so the street is always visible. */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; max-height: 56vh; overflow-y: auto; }
  #hud {
    display: none; align-items: center; justify-content: center; gap: 14px;
    padding: 12px 16px; flex-wrap: wrap;
    font-family: Futura, "Helvetica Neue", Arial, sans-serif; color: #163b4e;
    background: linear-gradient(to top, rgba(245,242,233,0.96), rgba(245,242,233,0));
  }
  #bars { display: flex; gap: 5px; }
  #bars span {
    width: 20px; height: 10px; border-radius: 2px; opacity: 0.35;
    transition: opacity 0.1s, transform 0.1s;
  }
  #bars span.on { opacity: 1; transform: scaleY(1.5); }
  #chordlabel { font-size: 15px; letter-spacing: 0.06em; min-width: 210px; text-align: center; }
  #hud button, #hud select {
    font-family: inherit; font-size: 13px; letter-spacing: 0.08em;
    background: #f5f2e9; border: 2px solid #163b4e; border-radius: 4px;
    color: #163b4e; padding: 6px 10px; cursor: pointer;
  }
  #hud button:hover, #hud select:hover { border-color: #e23b22; color: #e23b22; }
  #hud label { font-size: 12px; letter-spacing: 0.08em; color: #3a5560; display: flex; align-items: center; gap: 8px; }
  #hud input[type=range] { accent-color: #e23b22; width: 100px; }
  #fullscreen { font-size: 15px; line-height: 1; }
  /* the way into the builder is always visible and always reads as the live one */
  #build { border-color: #e23b22; color: #e23b22; font-weight: 600; }
  #build.on { background: #e23b22; color: #f5f2e9; }
  #hud button:disabled { cursor: default; }
  #hud button:disabled:hover { border-color: #163b4e; color: #163b4e; }

  /* ---- the block builder ---- */
  #builder {
    display: none; flex-direction: column; gap: 8px;
    padding: 10px 16px 6px; background: rgba(245, 242, 233, 0.97);
    border-top: 3px solid #163b4e;
    font-family: Futura, "Helvetica Neue", Arial, sans-serif; color: #163b4e;
  }
  #builder.collapsed #strip, #builder.collapsed #palette, #builder.collapsed #songs { display: none; }
  #songs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; letter-spacing: 0.08em; }
  #songname {
    font-family: inherit; font-size: 12px; padding: 4px 8px; width: 190px;
    background: #f5f2e9; border: 2px solid #163b4e; border-radius: 4px; color: #163b4e;
  }
  #songname::placeholder { color: #93a4ac; letter-spacing: 0.02em; }
  #slist { min-width: 190px; }
  #sdel { color: #a92715; border-color: #d8a99f; }
  #sdel:hover { background: #e23b22; color: #f5f2e9; border-color: #e23b22; }
  #builder button:disabled, #songname:disabled { opacity: 0.4; cursor: default; }
  #builder button:disabled:hover { border-color: #163b4e; color: #163b4e; }
  #sdel:disabled:hover { border-color: #d8a99f; color: #a92715; background: #f5f2e9; }
  #smsg { color: #e23b22; letter-spacing: 0.02em; }
  #bhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; letter-spacing: 0.08em; }
  #bhead .btitle { font-weight: 600; letter-spacing: 0.16em; color: #e23b22; }
  #bhead .hint { color: #3a5560; letter-spacing: 0.02em; }
  #builder button, #builder select {
    font-family: inherit; font-size: 12px; letter-spacing: 0.08em;
    background: #f5f2e9; border: 2px solid #163b4e; border-radius: 4px;
    color: #163b4e; padding: 4px 8px; cursor: pointer;
  }
  #builder button:hover, #builder select:hover { border-color: #e23b22; color: #e23b22; }

  #strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; align-items: stretch; }
  .card {
    flex: 0 0 auto; width: 92px; border: 3px solid #163b4e; border-radius: 6px;
    background: #f5f2e9; overflow: hidden; cursor: grab;
  }
  .card.sel { border-color: #e23b22; }
  .card.now { box-shadow: 0 0 0 3px #ffe9a3; }
  .card.drag { opacity: 0.4; }
  .chead { display: flex; align-items: center; gap: 3px; padding: 3px 4px; font-size: 11px; background: #ece7d8; }
  .chead span.n { flex: 1; font-weight: 600; }
  .mini { padding: 2px 4px !important; font-size: 10px !important; border-width: 1px !important; }
  .cfoot { display: flex; gap: 3px; padding: 3px 4px; background: #ece7d8; }
  .cfoot button { flex: 1; padding: 3px 0 !important; font-size: 10px !important; border-width: 1px !important; }
  .del { color: #a92715 !important; border-color: #d8a99f !important; font-weight: 600; }
  .del:hover { background: #e23b22 !important; color: #f5f2e9 !important; border-color: #e23b22 !important; }
  .card.only .del { opacity: 0.3; pointer-events: none; }
  .cbody { display: flex; gap: 2px; height: 54px; }
  .slot {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; color: #f5f2e9; line-height: 1.15;
  }
  .slot b { font-size: 15px; }
  .slot i { font-style: normal; font-size: 11px; opacity: 0.88; }
  .slot.on { box-shadow: inset 0 0 0 3px #ffe9a3; }
  .slot.hot, #addbar.hot { box-shadow: inset 0 0 0 3px #e23b22; }
  #addbar { flex: 0 0 auto; width: 44px; font-size: 22px !important; }

  #palette { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ptabs { display: flex; gap: 4px; }
  #ptabs button.on { background: #163b4e; color: #f5f2e9; }
  #pgrid { display: flex; gap: 5px; flex-wrap: wrap; }
  .pchip {
    display: flex; flex-direction: column; align-items: center; min-width: 54px;
    padding: 3px 5px !important; border-width: 2px !important; cursor: grab; line-height: 1.15;
  }
  .pchip b { font-size: 13px; }
  .pchip i { font-style: normal; font-size: 10px; color: #3a5560; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="overlay">
  <h1>THE 12 BLOCKS</h1>
  <p>The 12-bar blues as a walk around the neighborhood.<br>Each chord owns its blocks. The crosswalks are the barlines.</p>
  <div class="play"></div>
  <p style="font-size:13px;">Click anywhere to start walking. Sound on.</p>
</div>

<div id="dock">

<div id="builder">
  <div id="bhead">
    <span class="btitle">BUILD</span>
    <button id="lenminus" title="Remove the last block">−</button>
    <span id="lenval">4 blocks</span>
    <button id="lenplus" title="Add a block on the end">+</button>
    <button id="bclear" title="Start over from one block">CLEAR</button>
    <button id="bcopy" title="Load the 12-bar blues into the builder and edit from there">COPY BLUES</button>
    <button id="bcollapse" title="Hide the builder and watch the street">HIDE</button>
    <span class="hint">drag a chord onto a block · drag blocks to reorder · click a block to select it</span>
  </div>
  <div id="songs">
    <span class="btitle">SONGS</span>
    <input id="songname" type="text" placeholder="name this progression" maxlength="40" />
    <button id="ssave" title="Save the current progression under that name">SAVE</button>
    <select id="slist" title="Your saved progressions"></select>
    <button id="sload" title="Load the selected progression">LOAD</button>
    <button id="sdel" title="Delete the selected progression">DELETE</button>
    <span id="smsg" class="hint"></span>
  </div>
  <div id="strip"></div>
  <div id="palette">
    <div id="ptabs">
      <button data-tab="degree" class="on" title="Pick by function, the same chord in every key">ROMAN</button>
      <button data-tab="letter" title="Pick by letter name in the current key">LETTER</button>
    </div>
    <select id="qual" title="Chord quality"></select>
    <div id="pgrid"></div>
  </div>
</div>

<div id="hud">
  <button id="playpause">PAUSE</button>
  <button id="build" title="Build your own progression, one block at a time">BUILD</button>
  <button id="mode" title="Switch between the major and minor 12-bar blues">MAJOR</button>
  <button id="view" title="See the whole progression at once, four bars to a line">MAP</button>
  <label>key
    <select id="key"></select>
  </label>
  <label>feel
    <select id="style">
      <option value="shuffle" selected>shuffle</option>
      <option value="rock">rock</option>
      <option value="halftime">halftime</option>
      <option value="reggae">reggae</option>
      <option value="12/8">12/8</option>
    </select>
  </label>
  <div id="bars"></div>
  <div id="chordlabel"></div>
  <label>tempo <input id="tempo" type="range" min="52" max="170" value="126" /> <span id="bpmval">126</span></label>
  <div id="chorus" style="font-size:12px; color:#3a5560; letter-spacing:0.08em;"></div>
  <button id="fullscreen" title="Fullscreen">⛶</button>
</div>

</div>

<script>
(() => {
"use strict";

/* ---------- the harmony ---------- */
// A chord is stored as a KEY: "<semitones above the key root>:<quality>". Nothing
// stores a letter name, so changing the key transposes every progression at once
// and a chord picked by letter and the same chord picked by numeral are one object.
const QUALITY = {
  maj:  { intervals:[0,4,7],    walk:[0,4,7,9],  suffix:"",     roman:"",     family:"major",       shape:"square"  },
  min:  { intervals:[0,3,7],    walk:[0,3,7,10], suffix:"m",    roman:"",     family:"minor",       shape:"arch",    lower:true },
  dom7: { intervals:[0,4,7,10], walk:[0,4,7,9],  suffix:"7",    roman:"7",    family:"dominant",    shape:"tall"    },
  m7:   { intervals:[0,3,7,10], walk:[0,3,7,10], suffix:"m7",   roman:"m7",   family:"minor",       shape:"arch",    lower:true },
  maj7: { intervals:[0,4,7,11], walk:[0,4,7,11], suffix:"maj7", roman:"maj7", family:"major",       shape:"square"  },
  six:  { intervals:[0,4,7,9],  walk:[0,4,7,9],  suffix:"6",    roman:"6",    family:"major",       shape:"square"  },
  m7b5: { intervals:[0,3,6,10], walk:[0,3,6,10], suffix:"m7♭5", roman:"ø7",   family:"diminished",  shape:"diamond", lower:true },
  dim7: { intervals:[0,3,6,9],  walk:[0,3,6,9],  suffix:"°7",   roman:"°7",   family:"diminished",  shape:"diamond", lower:true },
  sus4: { intervals:[0,5,7],    walk:[0,5,7,10], suffix:"sus4", roman:"sus4", family:"suspended",   shape:"round"   },
  aug:  { intervals:[0,4,8],    walk:[0,4,8,10], suffix:"+",    roman:"+",    family:"suspended",   shape:"round"   }
};
const QUAL_ORDER = ["maj","min","dom7","m7","maj7","six","m7b5","dim7","sus4","aug"];
const QUAL_NAME = {
  maj:"major", min:"minor", dom7:"dominant 7", m7:"minor 7", maj7:"major 7",
  six:"sixth", m7b5:"half-diminished", dim7:"diminished 7", sus4:"sus4", aug:"augmented"
};

// Window SHAPE is chord family, so two chords that look alike really are alike.
// Window HEIGHT and the role letter beside each row carry the exact difference.
const ROMAN = ["I","♭II","II","♭III","III","IV","♭V","V","♭VI","VI","♭VII","VII"];

// Colour is FUNCTION: one hue per scale degree, so home stays blue, the
// subdominant stays gold and the dominant stays red in every key.
const FUNC_COLOR = [
  ["#3bb6e3","#1d7fb0"], ["#9b6fa8","#6d4a77"], ["#7c9a6d","#55704a"], ["#4c8f8b","#316260"],
  ["#d97b3f","#a1552a"], ["#e8b93e","#b8892a"], ["#6f7fa8","#4a5877"], ["#e23b22","#a92715"],
  ["#1d7fb0","#12556f"], ["#a85c7a","#7a3f57"], ["#5f9e6a","#3f6e48"], ["#8a7fb5","#5f5782"]
];

const CH = (semi, qual) => (((semi % 12) + 12) % 12) + ":" + qual;
const chParts = k => { const p = String(k).split(":"); return { semi: +p[0], qual: p[1] }; };

/* ---------- the forms ---------- */
// One chorus = N bars = N city blocks. A bar can hold one chord or split into two.
const PROGS = {
  major: [[CH(0,"dom7")],[CH(5,"dom7")],[CH(0,"dom7")],[CH(0,"dom7")],
          [CH(5,"dom7")],[CH(5,"dom7")],[CH(0,"dom7")],[CH(0,"dom7")],
          [CH(7,"dom7")],[CH(5,"dom7")],[CH(0,"dom7")],[CH(7,"dom7")]],
  minor: [[CH(0,"m7")],[CH(5,"m7")],[CH(0,"m7")],[CH(0,"m7")],
          [CH(5,"m7")],[CH(5,"m7")],[CH(0,"m7")],[CH(0,"m7")],
          [CH(8,"dom7")],[CH(7,"dom7")],[CH(0,"m7")],[CH(2,"m7b5"),CH(7,"dom7")]]
};

// A chord is named from its DEGREE, not from a lookup table, because the same
// pitch is spelled differently depending on what it is doing. In A, the ♭II is
// B♭ and the VI is F♯ — both would come out wrong from any one fixed table.
// Take the letter the numeral points at, then bend it to the pitch we need.
const LETTERS = "CDEFGAB";
const LETTER_SEMI = [0, 2, 4, 5, 7, 9, 11];
const DEG_STEP  = [0, 1, 1, 2, 2, 3, 4, 4, 5, 5, 6, 6];   // I ♭II II ♭III III IV ♭V V ♭VI VI ♭VII VII
const KEYS = [ {l:0,a:0},{l:1,a:-1},{l:1,a:0},{l:2,a:-1},{l:2,a:0},{l:3,a:0},
               {l:3,a:1},{l:4,a:0},{l:5,a:-1},{l:5,a:0},{l:6,a:-1},{l:6,a:0} ];
const KEY_NAMES = ["C","D♭","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const NOTES_FLAT  = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
const NOTES_SHARP = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const SHARP_KEYS = [7, 2, 9, 4, 11, 6];      // G D A E B F♯

// semi = semitones above the key root, i.e. which scale degree this chord is
function noteName(semi) {
  const li = (KEYS[keySemi].l + DEG_STEP[semi]) % 7;
  const actual = (keySemi + semi) % 12;
  const acc = (((actual - LETTER_SEMI[li]) + 18) % 12) - 6;
  // Two spellings are right on paper but never appear in a chord symbol: a
  // double accidental, and C♭ / F♭ / B♯ / E♯. Nobody charts an F♭7, they chart
  // an E7. Fall back to the plain letter for those.
  const unwritten = (acc === -1 && (li === 0 || li === 3)) || (acc === 1 && (li === 2 || li === 6));
  if (acc < -1 || acc > 1 || unwritten) {
    return (SHARP_KEYS.indexOf(keySemi) >= 0 ? NOTES_SHARP : NOTES_FLAT)[actual];
  }
  return LETTERS[li] + (acc === -1 ? "♭" : acc === 1 ? "♯" : "");
}

const CREAM = "#f5f2e9", CREAM_DIM = "#ece7d8", INK = "#163b4e", INK_SOFT = "#3a5560";

const STYLE_BPM = { shuffle: 126, rock: 132, halftime: 84, reggae: 100, "12/8": 63 };

/* ---------- state ---------- */
let mode = "major";              // "major" | "minor" | "build"
let lastBlues = "major";
let keySemi = 9;                 // A
let style = "shuffle";
let view = "street";             // "street" walks the blocks; "map" shows the whole chorus
let bpm = 126;
const MAXBARS = 32;
let userProg = null;             // the built progression, filled in below
let PROG = PROGS[mode];

const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);

// Resolve a chord key into playable pitches, a roman numeral and a letter name
// for the current key. Bass roots fold into G1..G2 so every key sits in a real
// bass register. Both names are always built, never one or the other.
function degSpec(key) {
  const { semi, qual } = chParts(key);
  const q = QUALITY[qual] || QUALITY.maj;
  let bassMidi = 31 + ((keySemi - 7 + 12) % 12) + semi;
  while (bassMidi > 43) bassMidi -= 12;
  while (bassMidi < 28) bassMidi += 12;
  let compMidi = bassMidi + 24;
  while (compMidi > 66) compMidi -= 12;
  while (compMidi < 55) compMidi += 12;
  return {
    key, semi, qual, family: q.family, win: q.shape,
    color: FUNC_COLOR[semi][0], dark: FUNC_COLOR[semi][1],
    intervals: q.intervals,
    walk: q.walk,
    // absolute pitch of each chord tone above the key root — the window floors
    voicing: q.intervals.map(iv => semi + iv),
    label: (q.lower ? ROMAN[semi].toLowerCase() : ROMAN[semi]) + q.roman,
    chordName: noteName(semi) + q.suffix,
    bassFreq: midiFreq(bassMidi),
    compFreq: midiFreq(compMidi)
  };
}
// Specs are memoised per key; changing the musical key just empties the cache.
let SPECS = {};
function rebuildSpecs() { SPECS = {}; }
function chord(key) { return SPECS[key] || (SPECS[key] = degSpec(key)); }

function chordCell(bar) { const L = PROG.length; return PROG[((bar % L) + L) % L]; }
function chordAt(bar, beat) {
  const cell = chordCell(bar);
  return chord(cell.length === 2 ? (beat < 2 ? cell[0] : cell[1]) : cell[0]);
}

/* ---------- audio ---------- */
let ctx = null, master = null, noiseBuf = null;
const beatDur = () => 60 / bpm;
let nextBeatTime = 0, nextBeatIndex = 0;
let beatQueue = [];
let playing = false, started = false;

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 4;
  master.connect(comp); comp.connect(ctx.destination);
  const b = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  noiseBuf = b;
}

function playBass(freq, t, dur) {
  const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.value = freq;
  f.type = "lowpass"; f.frequency.value = 420; f.Q.value = 0.8;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

function playChord(spec, t, gain, decay) {
  spec.intervals.forEach(semi => {
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = "triangle";
    o.frequency.value = spec.compFreq * Math.pow(2, semi / 12);
    f.type = "lowpass"; f.frequency.value = 2400;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t); o.stop(t + decay + 0.08);
  });
}

function playHat(t, loud) {
  const s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  s.buffer = noiseBuf;
  f.type = "highpass"; f.frequency.value = 6500;
  g.gain.setValueAtTime(loud ? 0.09 : 0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t);
}

function playKick(t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.09);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.2);
}

function playSnare(t, gain) {
  const s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  s.buffer = noiseBuf;
  f.type = "bandpass"; f.frequency.value = 1900; f.Q.value = 0.7;
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t);
  const o = ctx.createOscillator(), og = ctx.createGain();
  o.type = "sine"; o.frequency.value = 185;
  og.gain.setValueAtTime(gain * 0.7, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  o.connect(og); og.connect(master);
  o.start(t); o.stop(t + 0.12);
}

function walkNote(spec, beat) {
  return spec.bassFreq * Math.pow(2, spec.walk[beat] / 12);
}
const fifth = spec => spec.bassFreq * Math.pow(2, 7 / 12);

/* Each feel decides what the band plays on a given beat. */
function scheduleBeat(index, t) {
  const bar = Math.floor(index / 4) % PROG.length;
  const beat = index % 4;
  const spec = chordAt(bar, beat);
  const bd = beatDur();
  const off = t + bd / 2;          // straight offbeat
  const swung = t + bd * 2 / 3;    // shuffled offbeat

  if (style === "shuffle") {
    playBass(walkNote(spec, beat), t, bd * 0.9);
    if (beat === 0 || beat === 2) playKick(t);
    if (beat === 1 || beat === 3) playChord(spec, t, 0.16, 0.22);
    playHat(t, beat === 1 || beat === 3);
    playHat(swung, false);
  } else if (style === "rock") {
    playBass(spec.bassFreq, t, bd * 0.45);
    playBass(spec.bassFreq, off, bd * 0.45);
    if (beat === 0 || beat === 2) { playKick(t); playChord(spec, t, 0.15, 0.32); }
    if (beat === 1 || beat === 3) playSnare(t, 0.28);
    playHat(t, true); playHat(off, false);
  } else if (style === "halftime") {
    if (beat === 0) { playKick(t); playBass(spec.bassFreq, t, bd * 1.8); }
    if (beat === 2) { playSnare(t, 0.3); playChord(spec, t, 0.15, 0.4); }
    if (beat === 3) playBass(walkNote(spec, 3), off, bd * 0.4);
    playHat(t, beat === 0); playHat(off, false);
  } else if (style === "reggae") {
    if (beat === 0) playBass(spec.bassFreq, t, bd * 0.8);
    if (beat === 2) { playKick(t); playSnare(t, 0.16); playBass(fifth(spec), t, bd * 0.8); }
    playChord(spec, off, 0.13, 0.11);   // the skank, always on the offbeat
    playHat(t, false);
  } else {                              // 12/8, the slow blues
    playBass(walkNote(spec, beat), t, bd * 0.9);
    if (beat === 0 || beat === 2) playKick(t);
    if (beat === 1 || beat === 3) { playSnare(t, 0.22); playChord(spec, t, 0.15, 0.3); }
    playHat(t, true);
    playHat(t + bd / 3, false);
    playHat(t + bd * 2 / 3, false);
  }

  beatQueue.push({ index, time: t });
  if (beatQueue.length > 64) beatQueue.splice(0, beatQueue.length - 64);
}

function scheduler() {
  if (!playing) return;
  while (nextBeatTime < ctx.currentTime + 0.12) {
    scheduleBeat(nextBeatIndex, nextBeatTime);
    nextBeatTime += beatDur();
    nextBeatIndex += 1;
  }
}
setInterval(scheduler, 25);

function songBeat() {
  if (!ctx || beatQueue.length === 0) return 0;
  const now = ctx.currentTime;
  let last = beatQueue[0];
  for (let i = beatQueue.length - 1; i >= 0; i--) {
    if (beatQueue[i].time <= now) { last = beatQueue[i]; break; }
  }
  return last.index + Math.min(1, Math.max(0, (now - last.time) / beatDur()));
}

/* ---------- drawing ---------- */
const cv = document.getElementById("stage");
const cx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const BLOCK_W = 460;

function seeded(i, salt) {
  const x = Math.sin(i * 127.1 + salt * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

// The builder is a real panel at the bottom of the screen, so in build mode the
// street has to move up out from under it. Blues mode keeps its original horizon.
function bottomUI() { return document.getElementById("dock").offsetHeight; }
function groundY() {
  return mode === "build" ? Math.max(H * 0.34, H - bottomUI() - 70) : H * 0.78;
}

function drawSky(camX, t) {
  cx.fillStyle = CREAM;
  cx.fillRect(0, 0, W, H);

  const sx = W * 0.82, sy = H * 0.18, sr = Math.min(W, H) * 0.09;
  cx.save();
  cx.translate(sx, sy);
  cx.rotate(t * 0.6);
  cx.fillStyle = INK;
  cx.beginPath(); cx.arc(0, 0, sr, 0, Math.PI * 2); cx.fill();
  cx.strokeStyle = "rgba(245,242,233,0.25)";
  cx.lineWidth = 1;
  for (let r = sr * 0.45; r < sr * 0.92; r += sr * 0.09) {
    cx.beginPath(); cx.arc(0, 0, r, 0, Math.PI * 2); cx.stroke();
  }
  cx.fillStyle = "#e8b93e";
  cx.beginPath(); cx.arc(0, 0, sr * 0.3, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = INK;
  cx.beginPath(); cx.arc(0, 0, sr * 0.05, 0, Math.PI * 2); cx.fill();
  cx.restore();

  cx.fillStyle = "rgba(255,255,255,0.75)";
  for (let i = 0; i < 5; i++) {
    const cw = 130 + seeded(i, 9) * 120;
    const cxp = ((i * 700 + seeded(i, 3) * 400 - camX * 0.15) % (W + 500) + W + 500) % (W + 500) - 250;
    const cyp = H * (0.08 + seeded(i, 5) * 0.22);
    cx.beginPath();
    cx.ellipse(cxp, cyp, cw, 26 + seeded(i, 7) * 14, 0, 0, Math.PI * 2);
    cx.fill();
  }

  cx.fillStyle = "rgba(58,85,96,0.16)";
  const gy = groundY();
  for (let k = -1; k < W / 130 + 2; k++) {
    const wx = k * 130 - ((camX * 0.35) % 130);
    const hh = 70 + seeded(Math.floor(k + camX * 0.35 / 130), 11) * 140;
    cx.fillRect(wx, gy - hh - 60, 100, hh + 60);
  }
}

/* Windows ARE the chord. One row of windows per chord tone, placed at its real
   pitch height (one unit per semitone above the key root), labeled by its role.
   A minor chord's third floor sits one semitone lower than a major one's, the
   half-diminished drops its fifth too, and taller roots lift the whole voicing. */
const ROLE = { 0: "R", 1: "♭9", 2: "9", 3: "♭3", 4: "3", 5: "4",
               6: "♭5", 7: "5", 8: "♯5", 9: "6", 10: "♭7", 11: "7" };

function drawNoteRow(spec, bx, bw, cy, lit, compact) {
  cx.fillStyle = lit ? "#ffe9a3" : "rgba(245,242,233,0.85)";
  const n = Math.max(2, Math.min(4, Math.floor(bw / 78)));
  const left = bx + (compact ? 28 : 34), right = bx + bw - 14;
  const slot = (right - left) / n;
  const k = compact ? 0.62 : 1;                  // map cells shrink the glass, not the pitch
  for (let c = 0; c < n; c++) {
    const wx = left + c * slot + slot / 2;
    if (spec.win === "arch") {
      const ww = Math.min(34 * k, slot - 10);
      cx.beginPath();
      cx.moveTo(wx - ww / 2, cy + 11 * k); cx.lineTo(wx - ww / 2, cy - 3 * k);
      cx.arc(wx, cy - 3 * k, ww / 2, Math.PI, 0);
      cx.lineTo(wx + ww / 2, cy + 11 * k); cx.closePath(); cx.fill();
    } else if (spec.win === "round") {
      cx.beginPath(); cx.arc(wx, cy, Math.min(12 * k, slot / 2 - 5), 0, Math.PI * 2); cx.fill();
    } else if (spec.win === "diamond") {
      const s = Math.min(12 * k, slot / 2 - 4);
      cx.beginPath();
      cx.moveTo(wx, cy - s); cx.lineTo(wx + s, cy); cx.lineTo(wx, cy + s); cx.lineTo(wx - s, cy);
      cx.closePath(); cx.fill();
    } else if (spec.win === "tall") {
      cx.fillRect(wx - Math.min(14 * k, slot / 2 - 5), cy - 13 * k, Math.min(28 * k, slot - 10), 26 * k);
    } else {
      cx.fillRect(wx - Math.min(16 * k, slot / 2 - 5), cy - 9 * k, Math.min(32 * k, slot - 10), 18 * k);
    }
  }
}

function drawVoicing(spec, bx, by, bw, floorY, lit, bassAbs, compact) {
  spec.voicing.forEach((abs, i) => {
    const rel = spec.intervals[i];
    const cy = floorY(abs);
    drawNoteRow(spec, bx, bw, cy, lit || abs === bassAbs, compact);
    cx.fillStyle = "rgba(245,242,233,0.95)";
    cx.font = "600 " + (compact ? 10 : 11) + "px Futura, 'Helvetica Neue', sans-serif";
    cx.textAlign = "left"; cx.textBaseline = "middle";
    cx.fillText(ROLE[rel] || String(rel), bx + 8, cy);
  });
}

// Which chord tone the bass is on right now, as an absolute semitone (or null).
function bassAbsSemiAt(spec, beat) {
  let rel = null;
  if (style === "shuffle" || style === "12/8") rel = spec.walk[beat];
  else if (style === "rock") rel = 0;
  else if (style === "halftime") rel = beat === 0 ? 0 : (beat === 3 ? spec.walk[3] : null);
  else if (style === "reggae") rel = beat === 0 ? 0 : (beat === 2 ? 7 : null);
  if (rel === null || !spec.intervals.includes(rel)) return null;
  return spec.semi + rel;
}

function drawTexture(spec, bx, by, bw, bh) {
  cx.save();
  cx.beginPath(); cx.rect(bx, by, bw, bh); cx.clip();
  cx.strokeStyle = "rgba(22,59,78,0.12)";
  cx.lineWidth = 2;
  if (spec.win === "square") {
    for (let y = by + 14; y < by + bh; y += 16) {
      cx.beginPath(); cx.moveTo(bx, y); cx.lineTo(bx + bw, y); cx.stroke();
    }
  } else if (spec.win === "arch" || spec.win === "diamond") {
    for (let d = -bh; d < bw; d += 26) {
      cx.beginPath(); cx.moveTo(bx + d, by + bh); cx.lineTo(bx + d + bh, by); cx.stroke();
    }
  } else if (spec.win === "round") {
    for (let y = by + 20; y < by + bh; y += 30) {
      cx.beginPath(); cx.moveTo(bx, y); cx.lineTo(bx + bw, y); cx.stroke();
    }
  } else {
    for (let x = bx + 16; x < bx + bw; x += 22) {
      cx.beginPath(); cx.moveTo(x, by); cx.lineTo(x, by + bh); cx.stroke();
    }
  }
  cx.restore();
}

function stabLit(beat, beatPhase) {
  if (style === "reggae") return beatPhase >= 0.5 && beatPhase < 0.85;
  if (style === "rock") return (beat === 0 || beat === 2) && beatPhase < 0.4;
  if (style === "halftime") return beat === 2 && beatPhase < 0.5;
  return (beat === 1 || beat === 3) && beatPhase < 0.4;   // shuffle + 12/8
}

function drawOneBuilding(spec, bx, bw, barIdx, salt, isCurChord, beat, beatPhase) {
  const gy = groundY();
  // Height comes from the voicing: one unit per semitone, so the skyline is the harmony.
  const DOOR = 52, HEAD = 34;
  // 13px a semitone, unless the street has been pushed up by the builder panel
  // and the tallest chord in the vocabulary would run off the top.
  const UNIT = Math.min(13, (gy - 120) / 24);
  const maxSemi = spec.voicing[spec.voicing.length - 1];
  const pulse = isCurChord ? Math.max(0, 1 - beatPhase * 3) * 8 : 0;
  const bh = DOOR + maxSemi * UNIT + HEAD + pulse;
  const by = gy - bh;

  cx.fillStyle = spec.color;
  cx.fillRect(bx, by, bw, bh);
  drawTexture(spec, bx, by, bw, bh);
  cx.strokeStyle = INK; cx.lineWidth = 3;
  cx.strokeRect(bx, by, bw, bh);

  cx.fillStyle = spec.dark;
  if (seeded(barIdx, salt + 1) > 0.5) {
    cx.fillRect(bx - 6, by - 14, bw + 12, 14);
  } else {
    cx.beginPath();
    cx.moveTo(bx - 5, by); cx.lineTo(bx + bw / 2, by - 30); cx.lineTo(bx + bw + 5, by);
    cx.closePath(); cx.fill();
  }

  const lit = isCurChord && stabLit(beat, beatPhase);
  const bassAbs = isCurChord && beatPhase < 0.75 ? bassAbsSemiAt(spec, beat) : null;
  drawVoicing(spec, bx, by, bw, abs => gy - DOOR - abs * UNIT, lit, bassAbs, false);

  cx.fillStyle = spec.dark;
  cx.fillRect(bx + bw / 2 - 15, gy - 44, 30, 44);

  // chord sign: function on top, letter name underneath, always both
  const signY = by - 60 - (isCurChord ? Math.max(0, 1 - beatPhase * 2.5) * 10 : 0);
  const signW = Math.min(116, bw * 0.88), signX = bx + bw / 2 - signW / 2;
  cx.fillStyle = CREAM;
  cx.strokeStyle = INK; cx.lineWidth = 2.5;
  cx.beginPath();
  if (cx.roundRect) cx.roundRect(signX, signY, signW, 46, 6); else cx.rect(signX, signY, signW, 46);
  cx.fill(); cx.stroke();
  cx.textAlign = "center"; cx.textBaseline = "middle";
  cx.fillStyle = isCurChord ? "#e23b22" : INK;
  cx.font = "600 " + (spec.label.length > 4 ? 14 : 18) + "px Futura, 'Helvetica Neue', sans-serif";
  cx.fillText(spec.label, bx + bw / 2, signY + 16);
  cx.fillStyle = INK_SOFT;
  cx.font = (spec.chordName.length > 5 ? 11 : 13) + "px Futura, 'Helvetica Neue', sans-serif";
  cx.fillText(spec.chordName, bx + bw / 2, signY + 33);
}

function drawBlock(barIdx, screenX, beat, curBar, beatPhase) {
  const gy = groundY();
  const cell = chordCell(barIdx);
  const isCur = barIdx === curBar;
  const totalW = BLOCK_W * 0.72;
  const startX = screenX + (BLOCK_W - totalW) / 2;

  if (cell.length === 1) {
    drawOneBuilding(chord(cell[0]), startX, totalW, barIdx, 1, isCur, beat, beatPhase);
  } else {
    // a split bar: two narrower buildings share the block
    const bw = (totalW - 18) / 2;
    cell.forEach((name, i) => {
      const active = isCur && (i === 0 ? beat < 2 : beat >= 2);
      drawOneBuilding(chord(name), startX + i * (bw + 18), bw, barIdx, 1 + i * 3, active, beat, beatPhase);
    });
  }

  cx.fillStyle = INK_SOFT;
  cx.font = "12px Futura, 'Helvetica Neue', sans-serif";
  cx.textAlign = "center"; cx.textBaseline = "middle";
  cx.fillText("bar " + (barIdx + 1), screenX + BLOCK_W / 2, gy + 26);

  // the turnaround sign stands at the top of bar 9, where the home stretch begins
  if (mode !== "build" && barIdx === 8) {
    const px = screenX + 90, py = gy;   // clear of the streetlamp at the block edge
    cx.strokeStyle = INK; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(px, py); cx.lineTo(px, py - 92); cx.stroke();
    cx.fillStyle = "#e23b22";
    cx.beginPath();
    if (cx.roundRect) cx.roundRect(px - 66, py - 128, 132, 40, 5); else cx.rect(px - 66, py - 128, 132, 40);
    cx.fill();
    cx.fillStyle = CREAM;
    cx.font = "600 13px Futura, 'Helvetica Neue', sans-serif";
    cx.fillText("TURNAROUND", px, py - 108);
    cx.fillStyle = INK;
    cx.font = "600 18px Futura, 'Helvetica Neue', sans-serif";
    cx.fillText("↺", px, py - 76);
  }

  cx.fillStyle = "rgba(245,242,233,0.9)";
  for (let s = 0; s < 4; s++) {
    cx.fillRect(screenX + BLOCK_W - 26, gy + 8 + s * 12, 22, 7);
  }

  const lx = screenX + 8;
  cx.strokeStyle = INK; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(lx, gy); cx.lineTo(lx, gy - 120); cx.quadraticCurveTo(lx, gy - 138, lx + 18, gy - 138); cx.stroke();
  cx.fillStyle = "#e8b93e";
  cx.beginPath(); cx.arc(lx + 22, gy - 138, 6, 0, Math.PI * 2); cx.fill();
}

function drawStreet() {
  const gy = groundY();
  cx.fillStyle = CREAM_DIM;
  cx.fillRect(0, gy, W, H - gy);
  cx.fillStyle = INK;
  cx.fillRect(0, gy, W, 5);
  cx.fillStyle = "#2c4a5a";
  cx.fillRect(0, gy + 44, W, H - gy - 44);
  cx.fillStyle = "rgba(245,242,233,0.5)";
  cx.fillRect(0, gy + 40, W, 4);
}

function drawWalker(x, y, beatPos, walking, t) {
  // One full stride cycle per beat: footfalls land at the extremes of the swing,
  // which cos() puts exactly on the beat and the offbeat — steps are 8th notes.
  const swing = walking ? Math.cos(beatPos * Math.PI * 2) : 0;
  const bob = walking ? Math.abs(Math.sin(beatPos * Math.PI * 2)) * 5 : Math.sin(t * 2) * 2;
  const gy = y - bob;

  cx.save();
  cx.translate(x, gy);
  cx.lineCap = "round";

  cx.strokeStyle = INK; cx.lineWidth = 7;
  cx.beginPath(); cx.moveTo(0, -46); cx.lineTo(swing * 15, -22); cx.lineTo(swing * 20, 0); cx.stroke();
  cx.beginPath(); cx.moveTo(0, -46); cx.lineTo(-swing * 15, -22); cx.lineTo(-swing * 20, 0); cx.stroke();

  cx.strokeStyle = "#dfd8c3"; cx.lineWidth = 13;
  cx.beginPath(); cx.moveTo(0, -48); cx.lineTo(2, -84); cx.stroke();

  cx.strokeStyle = "#dfd8c3"; cx.lineWidth = 6;
  cx.beginPath(); cx.moveTo(1, -78); cx.lineTo(-swing * 13 + 4, -58); cx.stroke();
  cx.beginPath(); cx.moveTo(1, -78); cx.lineTo(swing * 13 + 4, -58); cx.stroke();

  cx.fillStyle = "#e8c39e";
  cx.beginPath(); cx.arc(3, -96, 11, 0, Math.PI * 2); cx.fill();

  cx.fillStyle = "#e23b22";
  cx.beginPath(); cx.arc(3, -99, 11, Math.PI, 0); cx.fill();
  cx.fillRect(-8, -101, 22, 5);

  cx.restore();
}

/* ---------- map view: the whole chorus at once, four bars to a line ---------- */
function mapGrid() {
  const n = PROG.length;
  // Four bars to a line is how a chart is read, so hold that as long as it fits.
  const cols = n <= 4 ? n : (n <= 16 ? 4 : (n <= 24 ? 6 : 8));
  const rows = Math.ceil(n / cols);
  const padX = Math.max(30, W * 0.05);
  const top = Math.max(64, H * 0.1);
  const bottom = bottomUI() + 50;           // room for the HUD and the builder
  const gap = Math.max(10, W * 0.014);
  const cellW = (W - padX * 2 - gap * (cols - 1)) / cols;
  const cellH = (H - top - bottom - gap * (rows - 1)) / rows;
  return { padX, top, gap, cellW, cellH, cols, rows };
}

function drawMapFacade(spec, x, y, w, h, active, beat, beatPhase) {
  cx.fillStyle = spec.color;
  cx.fillRect(x, y, w, h);
  drawTexture(spec, x, y, w, h);

  // voicing floors: the label strip up top stays clear, the root row sits at the bottom
  const lit = active && stabLit(beat, beatPhase);
  const bassAbs = active && beatPhase < 0.75 ? bassAbsSemiAt(spec, beat) : null;
  const unit = (h - 64) / 18;
  drawVoicing(spec, x, y, w, abs => y + h - 30 - abs * unit, lit, bassAbs, true);

  cx.strokeStyle = active ? "#e23b22" : INK;
  cx.lineWidth = active ? 5 : 3;
  cx.strokeRect(x, y, w, h);

  // both names, side by side where the cell is wide enough and stacked where it is not
  cx.textBaseline = "middle";
  const fs = Math.max(11, Math.min(17, w / 7));
  cx.fillStyle = active ? "#ffe9a3" : CREAM;
  cx.font = "600 " + fs + "px Futura, 'Helvetica Neue', sans-serif";
  cx.textAlign = "left";
  cx.fillText(spec.label, x + 8, y + 15);
  cx.font = Math.max(10, fs - 4) + "px Futura, 'Helvetica Neue', sans-serif";
  if (w > 150) {
    cx.textAlign = "right";
    cx.fillText(spec.chordName, x + w - 10, y + 15);
  } else {
    cx.textAlign = "left";
    cx.fillText(spec.chordName, x + 8, y + 15 + fs);
  }
}

function drawMap(t, beats, curBar, beat, beatPhase) {
  cx.fillStyle = CREAM;
  cx.fillRect(0, 0, W, H);

  // the record sun keeps spinning up in the corner
  const sr = Math.min(W, H) * 0.05;
  cx.save();
  cx.translate(W - sr - 24, sr + 24);
  cx.rotate(t * 0.6);
  cx.fillStyle = INK;
  cx.beginPath(); cx.arc(0, 0, sr, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = "#e8b93e";
  cx.beginPath(); cx.arc(0, 0, sr * 0.3, 0, Math.PI * 2); cx.fill();
  cx.restore();

  cx.fillStyle = INK_SOFT;
  cx.font = "14px Futura, 'Helvetica Neue', sans-serif";
  cx.textAlign = "left"; cx.textBaseline = "middle";
  const g = mapGrid();
  cx.fillText("one chorus · " + PROG.length + (PROG.length === 1 ? " bar" : " bars")
              + " · " + g.cols + " to a line", g.padX, g.top - 26);

  for (let i = 0; i < PROG.length; i++) {
    const r = Math.floor(i / g.cols), c = i % g.cols;
    const x = g.padX + c * (g.cellW + g.gap);
    const y = g.top + r * (g.cellH + g.gap);
    const cell = chordCell(i);
    const isCur = i === curBar;

    if (cell.length === 1) {
      drawMapFacade(chord(cell[0]), x, y, g.cellW, g.cellH, isCur, beat, beatPhase);
    } else {
      const half = (g.cellW - 8) / 2;
      cell.forEach((name, hi) => {
        const active = isCur && (hi === 0 ? beat < 2 : beat >= 2);
        drawMapFacade(chord(name), x + hi * (half + 8), y, half, g.cellH, active, beat, beatPhase);
      });
    }

    // bar number, top-left of the cell
    cx.fillStyle = INK;
    cx.font = "600 13px Futura, 'Helvetica Neue', sans-serif";
    cx.textAlign = "left"; cx.textBaseline = "middle";
    cx.fillText(String(i + 1), x + 8, y - 12);

    // the turnaround tag at the top of bar 9, where the home stretch begins
    if (mode !== "build" && i === 8) {
      cx.fillStyle = "#e23b22";
      cx.beginPath();
      if (cx.roundRect) cx.roundRect(x + 22, y - 24, 104, 22, 4); else cx.rect(x + 22, y - 24, 104, 22);
      cx.fill();
      cx.fillStyle = CREAM;
      cx.font = "600 11px Futura, 'Helvetica Neue', sans-serif";
      cx.textAlign = "center";
      cx.fillText("TURNAROUND", x + 74, y - 13);
    }
  }

  // back to the top: the last bar loops home to bar 1
  const lastI = PROG.length - 1;
  const lastX = g.padX + (lastI % g.cols) * (g.cellW + g.gap) + g.cellW;
  const lastY = g.top + Math.floor(lastI / g.cols) * (g.cellH + g.gap) + g.cellH;
  cx.fillStyle = "#e23b22";
  cx.font = "600 13px Futura, 'Helvetica Neue', sans-serif";
  cx.textAlign = "right"; cx.textBaseline = "middle";
  cx.fillText("↺ back to bar 1", lastX, lastY + 16);

  // the walker strolls the chart, one cell per bar, reading left to right
  if (started) {
    const r = Math.floor(curBar / g.cols), c = curBar % g.cols;
    const frac = (beats % 4) / 4;
    const wx = g.padX + c * (g.cellW + g.gap) + 14 + frac * (g.cellW - 28);
    const wy = g.top + r * (g.cellH + g.gap) + g.cellH;
    cx.save();
    cx.translate(wx, wy);
    cx.scale(0.6, 0.6);
    drawWalker(0, 0, beats, playing, t);
    cx.restore();
  }
}

/* ---------- hud ---------- */
const overlay = document.getElementById("overlay");
const hud = document.getElementById("hud");
const barsEl = document.getElementById("bars");
const chordEl = document.getElementById("chordlabel");
const chorusEl = document.getElementById("chorus");
const ppBtn = document.getElementById("playpause");
const buildBtn = document.getElementById("build");
const modeBtn = document.getElementById("mode");
const viewBtn = document.getElementById("view");
const keySel = document.getElementById("key");
const styleSel = document.getElementById("style");
const tempoEl = document.getElementById("tempo");
const bpmVal = document.getElementById("bpmval");
const fsBtn = document.getElementById("fullscreen");

KEY_NAMES.forEach((n, i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = n;
  if (i === keySemi) o.selected = true;
  keySel.appendChild(o);
});

let barCells = [];
function rebuildBarStrip() {
  barsEl.innerHTML = "";
  const w = Math.max(6, Math.min(20, Math.round(300 / PROG.length)));
  barCells = PROG.map(cell => {
    const s = document.createElement("span");
    s.style.width = w + "px";
    if (cell.length === 1) {
      s.style.background = chord(cell[0]).color;
    } else {
      s.style.background = "linear-gradient(90deg, " + chord(cell[0]).color + " 50%, " + chord(cell[1]).color + " 50%)";
    }
    barsEl.appendChild(s);
    return s;
  });
}

function setBpm(v) {
  bpm = v;
  tempoEl.value = v;
  bpmVal.textContent = v;
}

tempoEl.addEventListener("input", () => setBpm(parseInt(tempoEl.value, 10)));

viewBtn.addEventListener("click", () => {
  view = view === "street" ? "map" : "street";
  viewBtn.textContent = view === "street" ? "MAP" : "STREET";
});

// BUILD is its own toggle rather than a third stop on the MODE cycle, so the way
// into the builder is always one click and always the same button.
function setMode(m) {
  mode = m;
  if (m !== "build") lastBlues = m;
  PROG = m === "build" ? userProg : PROGS[m];
  modeBtn.textContent = lastBlues.toUpperCase();
  modeBtn.disabled = m === "build";
  modeBtn.style.opacity = m === "build" ? 0.4 : 1;
  buildBtn.classList.toggle("on", m === "build");
  buildBtn.textContent = m === "build" ? "BLUES" : "BUILD";
  buildBtn.title = m === "build" ? "Back to the 12-bar blues" : "Build your own progression, one block at a time";
  builderEl.style.display = m === "build" ? "flex" : "none";
  rebuildBarStrip();
  if (m === "build") renderStrip();
}
buildBtn.addEventListener("click", () => setMode(mode === "build" ? lastBlues : "build"));
modeBtn.addEventListener("click", () => { if (mode !== "build") setMode(mode === "major" ? "minor" : "major"); });

keySel.addEventListener("change", () => {
  keySemi = parseInt(keySel.value, 10);
  rebuildSpecs();          // letter names and the LETTER palette follow the key
  rebuildBarStrip();
  renderPalette();
  renderStrip();
});

styleSel.addEventListener("change", () => {
  style = styleSel.value;
  setBpm(STYLE_BPM[style]);
});

ppBtn.addEventListener("click", () => {
  if (!ctx) return;
  if (playing) {
    playing = false; ctx.suspend(); ppBtn.textContent = "WALK";
  } else {
    playing = true;
    nextBeatTime = Math.max(nextBeatTime, ctx.currentTime + 0.06);
    ctx.resume(); ppBtn.textContent = "PAUSE";
  }
});

fsBtn.addEventListener("click", () => {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else if (el.requestFullscreen) {
    el.requestFullscreen().catch(() => {});
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  }
});

/* ---------- the block builder ----------
   The progression is just an array of bars, each bar an array of one or two
   chord keys — exactly the shape the blues forms already use, so everything
   downstream (the band, the street, the map, the walker) needs no special case. */
const builderEl = document.getElementById("builder");
const stripEl = document.getElementById("strip");
const gridEl = document.getElementById("pgrid");
const qualSel = document.getElementById("qual");
const lenVal = document.getElementById("lenval");
const tabBtns = Array.prototype.slice.call(document.querySelectorAll("#ptabs button"));

let pickTab = "degree";
let pickQual = "maj";
let sel = { bar: 0, half: 0 };
let stripCards = [];

function validProg(raw) {
  if (!Array.isArray(raw) || !raw.length || raw.length > MAXBARS) return false;
  return raw.every(cell =>
    Array.isArray(cell) && cell.length >= 1 && cell.length <= 2 &&
    cell.every(k => {
      const p = chParts(k);
      return typeof k === "string" && QUALITY[p.qual] && p.semi >= 0 && p.semi < 12;
    }));
}
function saveProg() {
  try { localStorage.setItem("twelveBlocks.prog", JSON.stringify(userProg)); } catch (e) {}
}
function loadProg() {
  try {
    const raw = JSON.parse(localStorage.getItem("twelveBlocks.prog"));
    return validProg(raw) ? raw : null;
  } catch (e) { return null; }
}
// I - V - vi - IV, so build mode plays something recognisable the moment it opens
userProg = loadProg() || [[CH(0,"maj")], [CH(7,"maj")], [CH(9,"min")], [CH(5,"maj")]];

QUAL_ORDER.forEach(q => {
  const o = document.createElement("option");
  o.value = q; o.textContent = QUAL_NAME[q];
  qualSel.appendChild(o);
});
qualSel.value = pickQual;
qualSel.addEventListener("change", () => { pickQual = qualSel.value; renderPalette(); });

tabBtns.forEach(b => b.addEventListener("click", () => {
  pickTab = b.dataset.tab;
  tabBtns.forEach(o => o.classList.toggle("on", o === b));
  renderPalette();
}));

function twoLine(el, primary, secondary) {
  const b = document.createElement("b"); b.textContent = primary;
  const i = document.createElement("i"); i.textContent = secondary;
  el.appendChild(b); el.appendChild(i);
}

// Twelve chips. ROMAN orders them by scale degree, LETTER by note name — the
// same twelve chords either way, and every chip is labelled both ways.
function renderPalette() {
  gridEl.innerHTML = "";
  for (let i = 0; i < 12; i++) {
    const semi = pickTab === "degree" ? i : (((i - keySemi) % 12) + 12) % 12;
    const key = CH(semi, pickQual);
    const c = chord(key);
    const b = document.createElement("button");
    b.className = "pchip";
    b.draggable = true;
    b.style.borderColor = c.color;
    twoLine(b, pickTab === "degree" ? c.label : c.chordName,
               pickTab === "degree" ? c.chordName : c.label);
    b.querySelector("b").style.color = c.dark;
    b.addEventListener("click", () => assign(sel.bar, sel.half, key));
    b.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", "chord:" + key);
      e.dataTransfer.effectAllowed = "copy";
    });
    gridEl.appendChild(b);
  }
}

function readDrop(e) { return e.dataTransfer.getData("text/plain") || ""; }

function renderStrip() {
  stripEl.innerHTML = "";
  stripCards = userProg.map((cell, i) => {
    const card = document.createElement("div");
    card.className = "card" + (i === sel.bar ? " sel" : "") + (userProg.length === 1 ? " only" : "");
    card.draggable = true;

    const head = document.createElement("div");
    head.className = "chead";
    const num = document.createElement("span"); num.className = "n"; num.textContent = i + 1;
    const sp = document.createElement("button");
    sp.className = "mini";
    sp.textContent = cell.length === 2 ? "join" : "split";
    sp.title = cell.length === 2 ? "one chord for the whole bar" : "two chords, two beats each";
    sp.addEventListener("click", e => { e.stopPropagation(); toggleSplit(i); });
    head.appendChild(num); head.appendChild(sp);
    card.appendChild(head);

    const body = document.createElement("div");
    body.className = "cbody";
    cell.forEach((key, h) => {
      const c = chord(key);
      const slot = document.createElement("div");
      slot.className = "slot" + (sel.bar === i && sel.half === h ? " on" : "");
      slot.style.background = c.color;
      slot.title = c.chordName + "  ·  " + c.label;
      twoLine(slot, c.chordName, c.label);   // letter and function, always both
      slot.addEventListener("click", () => { sel = { bar: i, half: h }; renderStrip(); });
      slot.addEventListener("dragover", e => { e.preventDefault(); slot.classList.add("hot"); });
      slot.addEventListener("dragleave", () => slot.classList.remove("hot"));
      slot.addEventListener("drop", e => {
        e.preventDefault(); e.stopPropagation();
        slot.classList.remove("hot");
        const d = readDrop(e);
        if (d.indexOf("chord:") === 0) assign(i, h, d.slice(6));
        else if (d.indexOf("move:") === 0) moveBar(+d.slice(5), i);
      });
      body.appendChild(slot);
    });
    card.appendChild(body);

    // Per-block editing lives on the block itself: copy it, delete it, or open a
    // new empty block in front of it. A one-block progression cannot be emptied.
    const foot = document.createElement("div");
    foot.className = "cfoot";
    const ins = document.createElement("button");
    ins.textContent = "+◀"; ins.title = "insert a new block before this one";
    ins.addEventListener("click", e => { e.stopPropagation(); insertBar(i); });
    const dup = document.createElement("button");
    dup.textContent = "⧉"; dup.title = "duplicate this block";
    dup.addEventListener("click", e => { e.stopPropagation(); duplicateBar(i); });
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "DEL";
    del.title = userProg.length === 1 ? "the last block cannot be deleted" : "delete block " + (i + 1);
    del.addEventListener("click", e => { e.stopPropagation(); removeBar(i); });
    foot.appendChild(ins); foot.appendChild(dup); foot.appendChild(del);
    card.appendChild(foot);

    card.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", "move:" + i);
      e.dataTransfer.effectAllowed = "move";
      card.classList.add("drag");
    });
    card.addEventListener("dragend", () => card.classList.remove("drag"));
    card.addEventListener("dragover", e => e.preventDefault());
    card.addEventListener("drop", e => {
      e.preventDefault();
      const d = readDrop(e);
      if (d.indexOf("move:") === 0) moveBar(+d.slice(5), i);
      else if (d.indexOf("chord:") === 0) assign(i, 0, d.slice(6));
    });

    stripEl.appendChild(card);
    return card;
  });

  const add = document.createElement("button");
  add.id = "addbar"; add.textContent = "+";
  add.title = "add a block on the end, or drop a chord here";
  add.addEventListener("click", () => addBar());
  add.addEventListener("dragover", e => { e.preventDefault(); add.classList.add("hot"); });
  add.addEventListener("dragleave", () => add.classList.remove("hot"));
  add.addEventListener("drop", e => {
    e.preventDefault(); add.classList.remove("hot");
    const d = readDrop(e);
    if (d.indexOf("chord:") === 0) addBar(d.slice(6));
    else if (d.indexOf("move:") === 0) moveBar(+d.slice(5), userProg.length - 1);
  });
  stripEl.appendChild(add);

  lenVal.textContent = userProg.length + (userProg.length === 1 ? " block" : " blocks");
}

// One place where an edit becomes audible: re-point the live progression, redraw
// the HUD strip, save, redraw the cards. The band picks it up on the next beat.
function commit() {
  if (mode === "build") { PROG = userProg; rebuildBarStrip(); }
  saveProg();
  renderStrip();
}
function assign(bar, half, key) {
  const cell = userProg[bar];
  if (!cell) return;
  const h = Math.min(half, cell.length - 1);
  cell[h] = key;
  sel = { bar: bar, half: h };
  commit();
}
function addBar(key) {
  if (userProg.length >= MAXBARS) return;
  const last = userProg[userProg.length - 1];
  userProg.push([key || last[last.length - 1]]);
  sel = { bar: userProg.length - 1, half: 0 };
  commit();
}
function removeBar(i) {
  if (userProg.length <= 1 || i < 0 || i >= userProg.length) return;
  userProg.splice(i, 1);
  sel = { bar: Math.min(sel.bar, userProg.length - 1), half: 0 };
  commit();
}
function insertBar(i) {
  if (userProg.length >= MAXBARS) return;
  userProg.splice(i, 0, [userProg[i][0]]);
  sel = { bar: i, half: 0 };
  commit();
}
function duplicateBar(i) {
  if (userProg.length >= MAXBARS) return;
  userProg.splice(i + 1, 0, userProg[i].slice());
  sel = { bar: i + 1, half: 0 };
  commit();
}
function moveBar(from, to) {
  if (from === to || from < 0 || from >= userProg.length) return;
  const cell = userProg.splice(from, 1)[0];
  userProg.splice(to, 0, cell);
  sel = { bar: to, half: 0 };
  commit();
}
function toggleSplit(i) {
  const cell = userProg[i];
  if (cell.length === 2) cell.length = 1; else cell.push(cell[0]);
  sel = { bar: i, half: 0 };
  commit();
}
function replaceProg(next) {
  userProg = next;
  PROG = userProg;
  sel = { bar: 0, half: 0 };
  commit();
}

/* ---------- the song library ----------
   Saved songs keep the key they were written in as well as the chords. The
   chords themselves are degrees, so a song loaded into a different key would
   still be the same tune — but a blues in A is a blues in A, so restore it. */
const LIB_KEY = "twelveBlocks.songs";
const nameEl = document.getElementById("songname");
const listEl = document.getElementById("slist");
const msgEl = document.getElementById("smsg");
const saveBtn = document.getElementById("ssave");
const loadBtn = document.getElementById("sload");
const delBtn = document.getElementById("sdel");
let songs = [];
let msgTimer = 0;

function say(text) {
  msgEl.textContent = text;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { msgEl.textContent = ""; }, 2600);
}
function storageOK() {
  try { localStorage.setItem("twelveBlocks.probe", "1"); localStorage.removeItem("twelveBlocks.probe"); return true; }
  catch (e) { return false; }
}
function loadLibrary() {
  let raw = [];
  try { raw = JSON.parse(localStorage.getItem(LIB_KEY)) || []; } catch (e) { raw = []; }
  // Anything malformed is dropped rather than allowed to break the picker.
  songs = Array.isArray(raw) ? raw.filter(s =>
    s && typeof s.name === "string" && validProg(s.prog)) : [];
}
function saveLibrary() {
  try { localStorage.setItem(LIB_KEY, JSON.stringify(songs)); return true; }
  catch (e) { say("out of browser storage"); return false; }
}
function renderList() {
  const keep = listEl.value;
  listEl.innerHTML = "";
  if (!songs.length) {
    const o = document.createElement("option");
    o.value = ""; o.textContent = "— nothing saved yet —";
    listEl.appendChild(o);
  } else {
    songs.forEach((s, i) => {
      const o = document.createElement("option");
      o.value = String(i);
      o.textContent = s.name + "  (" + s.prog.length + " · " + (KEY_NAMES[s.key] || "?") + ")";
      listEl.appendChild(o);
    });
    if (keep && songs[+keep]) listEl.value = keep;
  }
  const empty = !songs.length;
  listEl.disabled = empty; loadBtn.disabled = empty; delBtn.disabled = empty;
}

saveBtn.addEventListener("click", () => {
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return say("give it a name first"); }
  const entry = { name, key: keySemi, prog: userProg.map(c => c.slice()) };
  const at = songs.findIndex(s => s.name.toLowerCase() === name.toLowerCase());
  if (at >= 0) songs[at] = entry; else songs.push(entry);
  if (!saveLibrary()) return;
  renderList();
  listEl.value = String(at >= 0 ? at : songs.length - 1);
  say(at >= 0 ? "replaced " + name : "saved " + name);
});

loadBtn.addEventListener("click", () => {
  const s = songs[+listEl.value];
  if (!s) return;
  keySemi = s.key;
  keySel.value = String(keySemi);
  rebuildSpecs();
  renderPalette();
  nameEl.value = s.name;
  if (mode !== "build") setMode("build");
  replaceProg(s.prog.map(c => c.slice()));
  say("loaded " + s.name);
});

delBtn.addEventListener("click", () => {
  const i = +listEl.value;
  const s = songs[i];
  if (!s) return;
  songs.splice(i, 1);
  if (!saveLibrary()) return;
  renderList();
  say("deleted " + s.name);
});

// Enter in the name box saves, so naming and saving is one gesture.
nameEl.addEventListener("keydown", e => { if (e.key === "Enter") saveBtn.click(); });
// The canvas listens for keys too; don't let typing a song name drive the app.
["keydown", "keyup", "keypress"].forEach(t =>
  nameEl.addEventListener(t, e => e.stopPropagation()));

loadLibrary();
renderList();
if (!storageOK()) {
  [saveBtn, loadBtn, delBtn, nameEl].forEach(el => { el.disabled = true; });
  say("this browser is blocking storage, so songs cannot be saved");
}

document.getElementById("lenminus").addEventListener("click", () => removeBar(userProg.length - 1));
document.getElementById("lenplus").addEventListener("click", () => addBar());
document.getElementById("bclear").addEventListener("click", () => replaceProg([[CH(0, "maj")]]));
document.getElementById("bcopy").addEventListener("click", () =>
  replaceProg(PROGS[lastBlues].map(cell => cell.slice())));
document.getElementById("bcollapse").addEventListener("click", e => {
  const hidden = builderEl.classList.toggle("collapsed");
  e.target.textContent = hidden ? "SHOW" : "HIDE";
});

renderPalette();
renderStrip();
setMode("major");

overlay.addEventListener("click", () => {
  if (started) return;
  started = true;
  initAudio();
  nextBeatTime = ctx.currentTime + 0.15;
  playing = true;
  overlay.style.display = "none";
  hud.style.display = "flex";
});

/* ---------- main loop ---------- */
function frame(ms) {
  const t = ms / 1000;
  const beats = started ? songBeat() : 0;
  const barsFloat = beats / 4;
  const curBar = Math.floor(barsFloat) % PROG.length;
  const beat = Math.floor(beats) % 4;
  const beatPhase = beats - Math.floor(beats);
  const chorusNum = Math.floor(barsFloat / PROG.length) + 1;

  // The walker's world position IS the musical position: he stands at the left
  // edge of block n exactly when bar n+1 begins, and steps onto the crosswalk
  // exactly as the bar completes. No offset, or the eye reads him ahead of the band.
  const walkerScreenX = W * 0.34;
  const worldX = barsFloat * BLOCK_W;
  const camX = worldX - walkerScreenX;

  if (view === "map") {
    drawMap(t, beats, curBar, beat, beatPhase);
  } else {
    drawSky(camX, t);
    drawStreet();

    const firstK = Math.floor(camX / BLOCK_W) - 1;
    const lastK = Math.floor((camX + W) / BLOCK_W) + 1;
    for (let k = firstK; k <= lastK; k++) {
      const barIdx = ((k % PROG.length) + PROG.length) % PROG.length;
      drawBlock(barIdx, k * BLOCK_W - camX, beat, started && playing ? curBar : -1, beatPhase);
    }

    drawWalker(walkerScreenX, groundY() + 44, beats, started && playing, t);
  }

  if (started) {
    barCells.forEach((s, i) => s.classList.toggle("on", i === curBar));
    if (mode === "build") stripCards.forEach((c, i) => c.classList.toggle("now", i === curBar));
    const cell = chordCell(curBar);
    let label;
    if (cell.length === 1) {
      const sp = chord(cell[0]);
      label = sp.label + " · " + sp.chordName;
    } else {
      const a = chord(cell[0]), b = chord(cell[1]);
      label = a.label + "–" + b.label + " · " + a.chordName + "–" + b.chordName;
    }
    chordEl.textContent = "bar " + (curBar + 1) + " of " + PROG.length + " · " + label;
    chorusEl.textContent = "chorus " + chorusNum;
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
