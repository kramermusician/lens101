<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blues Orbit · the minor blues wheel</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "SF Mono", "Menlo", "Consolas", monospace; color: #fff; }
  canvas { display: block; touch-action: manipulation; }
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: #000; border-top: 1px solid #fff;
    flex-wrap: wrap; z-index: 5;
  }
  button, select {
    font-family: inherit; font-size: 12px; letter-spacing: 0.12em;
    background: #000; color: #fff; border: 1px solid #fff;
    padding: 8px 14px; cursor: pointer; border-radius: 0;
    text-transform: uppercase;
  }
  button:hover, select:hover { background: #fff; color: #000; }
  button.on { background: #fff; color: #000; }
  select { appearance: none; -webkit-appearance: none; padding-right: 22px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='6'><path d='M0 0h8L4 6z' fill='white'/></svg>");
    background-repeat: no-repeat; background-position: right 7px center; }
  select:hover { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='6'><path d='M0 0h8L4 6z' fill='black'/></svg>"); }
  .grp { display: flex; align-items: center; gap: 8px; }
  .lbl { font-size: 10px; letter-spacing: 0.18em; opacity: 0.7; }
  input[type=range] {
    -webkit-appearance: none; width: 130px; height: 1px; background: #fff; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; background: #000;
    border: 1px solid #fff; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb:hover { background: #fff; }
  #bpmVal { min-width: 3ch; display: inline-block; text-align: right; font-size: 12px; }
  #tapHint {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 10; cursor: pointer; background: rgba(0,0,0,0.35);
  }
  #tapHint span {
    border: 1px solid #fff; padding: 14px 26px; font-size: 13px; letter-spacing: 0.25em;
    animation: blink 1.4s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0.35; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="tapHint"><span>▸ CLICK TO LAUNCH · SOUND ON</span></div>

<div id="dock">
  <button id="playBtn">▸ Launch</button>
  <div class="grp" id="editGrp" hidden>
    <button id="prevCh" title="Try the previous chord here">◂</button>
    <span class="lbl" id="editLbl">BAR 1</span>
    <button id="nextCh" title="Try the next chord here">▸</button>
  </div>
  <button id="resetBtn" hidden title="Restore the real minor blues">Reset</button>
  <div class="grp">
    <span class="lbl">KEY</span>
    <select id="keySel"></select>
  </div>
  <div class="grp">
    <span class="lbl">TEMPO</span>
    <input type="range" id="bpm" min="50" max="160" value="92" />
    <span id="bpmVal">92</span>
  </div>
  <button id="fsBtn" title="Fullscreen">⛶</button>
</div>

<script>
"use strict";

/* ================= THE FORM =================
   Minor blues, twelve bars:
   i | iv | i | i | iv | iv | i | i | bVI | V7 | i | iiø7–V7b9 */

const CH = {
  i:    { roman: "i",     suf: "m",   off: 0,  tones: [0, 3, 7, 12] },
  iv:   { roman: "iv",    suf: "m",   off: 5,  tones: [0, 3, 7, 12] },
  v:    { roman: "v",     suf: "m",   off: 7,  tones: [0, 3, 7, 12] },
  bIII: { roman: "♭III",  suf: "",    off: 3,  tones: [0, 4, 7, 12] },
  bVI:  { roman: "♭VI",   suf: "",    off: 8,  tones: [0, 4, 7, 11] },
  bVII: { roman: "♭VII",  suf: "",    off: 10, tones: [0, 4, 7, 12] },
  V7:   { roman: "V7",    suf: "7",   off: 7,  tones: [0, 4, 7, 10] },
  IV7:  { roman: "IV7",   suf: "7",   off: 5,  tones: [0, 4, 7, 10] },
  iio:  { roman: "iiø7",  suf: "ø7",  off: 2,  tones: [0, 3, 6, 10] },
  V7b9: { roman: "V7♭9",  suf: "7♭9", off: 7,  tones: [0, 4, 7, 10, 13] },
};

// The chords a sector can be swapped to while experimenting.
const PALETTE = ["i", "iv", "v", "V7", "IV7", "bIII", "bVI", "bVII", "iio", "V7b9"];

// One entry per bar; bar 12 carries two chords, two beats each.
const BARS = [
  ["i"], ["iv"], ["i"], ["i"],
  ["iv"], ["iv"], ["i"], ["i"],
  ["bVI"], ["V7"], ["i"], ["iio", "V7b9"],
];

// The live progression: starts canonical, mutable while experimenting.
let PROG = BARS.map(c => c.slice());
function isModified() {
  return PROG.some((c, i) => c.some((id, h) => id !== BARS[i][h]));
}

const SHARP = ["A","A♯","B","C","C♯","D","D♯","E","F","F♯","G","G♯"];
const FLAT  = ["A","B♭","B","C","D♭","D","E♭","E","F","G♭","G","A♭"];
const KEYS = [
  { name: "A minor",  semi: 0,  flat: false },
  { name: "B minor",  semi: 2,  flat: false },
  { name: "C minor",  semi: 3,  flat: true  },
  { name: "D minor",  semi: 5,  flat: true  },
  { name: "E minor",  semi: 7,  flat: false },
  { name: "F minor",  semi: 8,  flat: true  },
  { name: "F♯ minor", semi: 9,  flat: false },
  { name: "G minor",  semi: 10, flat: true  },
];

let keyIdx = 0;
function noteName(semi) {
  const k = KEYS[keyIdx];
  return (k.flat ? FLAT : SHARP)[((semi % 12) + 12) % 12];
}
function chordName(id) {
  const c = CH[id];
  return noteName(KEYS[keyIdx].semi + c.off) + c.suf;
}
// A2-region root frequency for a chord.
function rootFreq(id) {
  const semiFromA2 = ((KEYS[keyIdx].semi + CH[id].off) % 12);
  return 110 * Math.pow(2, semiFromA2 / 12);
}

/* ================= TRANSPORT =================
   The animation clock is the audio clock; nothing drifts.
   Stop parks the wheel; Launch always restarts from bar 1. */

let ctx = null, master = null, comp = null;
let playing = false;
let bpm = 92;
let songStart = 0;
let nextBeat = 0;
let nextBeatTime = 0;
let schedTimer = 0;
const LOOKAHEAD = 0.12;
const BEATS_PER_BAR = 4;
const TOTAL_BEATS = 12 * BEATS_PER_BAR;

function beatDur() { return 60 / bpm; }

function chordAtBeat(beat) {
  const b = ((beat % TOTAL_BEATS) + TOTAL_BEATS) % TOTAL_BEATS;
  const bar = Math.floor(b / BEATS_PER_BAR);
  const inBar = b % BEATS_PER_BAR;
  const cell = PROG[bar];
  const half = (cell.length === 2 && inBar >= 2) ? 1 : 0;
  return { bar, half, id: cell[half] };
}

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4;
  master = ctx.createGain();
  master.gain.value = 0.85;
  master.connect(comp); comp.connect(ctx.destination);
}
function audioReady() {
  if (!ctx) initAudio();
  if (ctx.state !== "running") ctx.resume();
}

/* ---- instruments: thin, mono-ish, radio-from-space ---- */

function playBass(freq, t, dur, vel) {
  const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = freq;
  const o2 = ctx.createOscillator(); o2.type = "square"; o2.frequency.value = freq;
  const g = ctx.createGain(), g2 = ctx.createGain(), f = ctx.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 520; f.Q.value = 0.7;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vel, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  g2.gain.value = 0.18;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(f); f.connect(master);
  o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}

function playChord(id, t, gain, dur) {
  const base = rootFreq(id) * 2;
  for (const semi of CH[id].tones) {
    const o = ctx.createOscillator(); o.type = "square";
    o.frequency.value = base * Math.pow(2, semi / 12);
    const g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = "lowpass"; f.frequency.setValueAtTime(2600, t);
    f.frequency.exponentialRampToValueAtTime(700, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
}

// Gentle audition: soft sine arpeggio up the chord, low root underneath.
function playArp(id) {
  audioReady();
  const t0 = ctx.currentTime + 0.03;
  const base = rootFreq(id) * 2;
  const seq = CH[id].tones.slice();
  if (seq[seq.length - 1] < 12) seq.push(seq[0] + 12);

  const root = ctx.createOscillator(), rg = ctx.createGain();
  root.type = "triangle"; root.frequency.value = rootFreq(id);
  rg.gain.setValueAtTime(0, t0);
  rg.gain.linearRampToValueAtTime(0.22, t0 + 0.03);
  rg.gain.exponentialRampToValueAtTime(0.001, t0 + 1.6);
  root.connect(rg); rg.connect(master);
  root.start(t0); root.stop(t0 + 1.7);

  seq.forEach((semi, i) => {
    const t = t0 + i * 0.15;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = base * Math.pow(2, semi / 12);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 1.2);
  });
}

let noiseBuf = null;
function noise() {
  if (!noiseBuf) {
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = ctx.createBufferSource(); s.buffer = noiseBuf; return s;
}

function playHat(t, loud) {
  const s = noise(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  f.type = "highpass"; f.frequency.value = 7000;
  g.gain.setValueAtTime(loud ? 0.16 : 0.07, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + 0.08);
}

function playKick(t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.1);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.2);
}

function playSnare(t) {
  const s = noise(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  f.type = "bandpass"; f.frequency.value = 1900; f.Q.value = 0.8;
  g.gain.setValueAtTime(0.34, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + 0.18);
}

/* ---- the band, one beat at a time, shuffle feel ---- */

function scheduleBeat(beat, t) {
  const bd = beatDur();
  const swing = bd * (2 / 3);
  const cur = chordAtBeat(beat);
  const nxt = chordAtBeat(beat + 1);
  const inBar = beat % BEATS_PER_BAR;

  playHat(t, true); playHat(t + swing, false);
  if (inBar === 0 || inBar === 2) playKick(t);
  if (inBar === 1 || inBar === 3) playSnare(t);

  const r = rootFreq(cur.id);
  const tones = CH[cur.id].tones;
  let bf;
  const changing = nxt.id !== cur.id || nxt.bar !== cur.bar;
  const last = (inBar === 3) || (cur.half !== nxt.half && changing);
  if (last && changing) {
    const nr = rootFreq(nxt.id);
    bf = nr * Math.pow(2, (nr > r ? -1 : 1) / 12);
  } else if (inBar === 0 || (cur.half === 1 && inBar === 2)) bf = r;
  else if (inBar === 1 || inBar === 3) bf = r * Math.pow(2, tones[1] / 12);
  else bf = r * Math.pow(2, tones[2] / 12);
  playBass(bf, t, bd * 0.95, 0.5);

  const firstOfChord = inBar === 0 || (cur.half === 1 && inBar === 2);
  if (firstOfChord) playChord(cur.id, t, 0.06, bd * 1.8);
  if (inBar === 1 || inBar === 3) playChord(cur.id, t + swing, 0.05, bd * 0.5);
}

function scheduler() {
  if (!playing) return;
  while (nextBeatTime < ctx.currentTime + LOOKAHEAD) {
    scheduleBeat(nextBeat, nextBeatTime);
    nextBeat++;
    nextBeatTime = songStart + nextBeat * beatDur();
  }
  schedTimer = setTimeout(scheduler, 30);
}

function songBeat() {
  if (!playing) return 0;
  return (ctx.currentTime - songStart) / beatDur();
}

function start() {
  audioReady();
  clearTimeout(schedTimer);
  playing = true;
  selBar = -1; updateEditUI();
  songStart = ctx.currentTime + 0.08;
  nextBeat = 0;
  nextBeatTime = songStart;
  // park the wheel within one turn of home so bar 1 is a short ease away
  wheelAngle -= Math.round(wheelAngle / (Math.PI * 2)) * Math.PI * 2;
  wheelVel = 0;
  scheduler();
  playBtn.textContent = "■ Stop";
  playBtn.classList.add("on");
}
function stop() {
  playing = false;
  clearTimeout(schedTimer);
  // ease the wheel back to bar 1 without unwinding old laps
  wheelAngle -= Math.round(wheelAngle / (Math.PI * 2)) * Math.PI * 2;
  wheelVel = 0;
  playBtn.textContent = "▸ Launch";
  playBtn.classList.remove("on");
  updateEditUI();
}

/* ================= THE WHEEL ================= */

const cv = document.getElementById("cv");
const g2d = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight - document.getElementById("dock").offsetHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  g2d.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

function geo() {
  const cx = W / 2, cy = H / 2 + 8;
  const R = Math.min(W, H) * 0.395;
  return { cx, cy, R, hubR: R * 0.42 };
}

const STARS = [];
(function () {
  let s = 42;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 130; i++) STARS.push({ x: rnd(), y: rnd(), r: rnd() * 1.3 + 0.3, tw: rnd() * 6.28 });
})();

const SLICE = (Math.PI * 2) / 12;

let wheelAngle = 0, wheelVel = 0;
let selBar = -1, selHalf = 0;   // sector selected while stopped

function targetAngle(beat) {
  const bar = Math.floor((((beat % TOTAL_BEATS) + TOTAL_BEATS) % TOTAL_BEATS) / BEATS_PER_BAR)
            + Math.floor(beat / TOTAL_BEATS) * 12;
  return -bar * SLICE;
}

function draw() {
  requestAnimationFrame(draw);
  const beat = songBeat();
  const loopBeat = ((beat % TOTAL_BEATS) + TOTAL_BEATS) % TOTAL_BEATS;
  const cur = chordAtBeat(Math.floor(loopBeat));
  const beatPhase = loopBeat % 1;
  const inBar = Math.floor(loopBeat) % BEATS_PER_BAR;

  // which sector is lit: the band's bar while playing, the tapped one while stopped
  const hlBar = playing ? cur.bar : selBar;
  const hlHalf = playing ? cur.half : selHalf;
  const hubId = playing ? cur.id : (selBar >= 0 ? PROG[selBar][selHalf] : PROG[0][0]);

  const tgt = targetAngle(beat);
  const k = 0.016, damp = 0.82;
  wheelVel = (wheelVel + (tgt - wheelAngle) * k) * damp;
  wheelAngle += wheelVel;

  const t = performance.now() / 1000;
  g2d.clearRect(0, 0, W, H);
  g2d.fillStyle = "#000"; g2d.fillRect(0, 0, W, H);

  for (const st of STARS) {
    const a = 0.25 + 0.55 * Math.abs(Math.sin(t * 0.6 + st.tw));
    g2d.fillStyle = "rgba(255,255,255," + a.toFixed(2) + ")";
    g2d.fillRect(st.x * W, st.y * H, st.r, st.r);
  }

  const { cx, cy, R, hubR } = geo();

  g2d.strokeStyle = "rgba(255,255,255,0.35)";
  g2d.lineWidth = 1;
  g2d.setLineDash([2, 6]);
  g2d.beginPath(); g2d.arc(cx, cy, R * 1.12, 0, Math.PI * 2); g2d.stroke();
  g2d.setLineDash([1, 9]);
  g2d.beginPath(); g2d.arc(cx, cy, R * 1.2, t * 0.02 % (Math.PI * 2), t * 0.02 + Math.PI * 2); g2d.stroke();
  g2d.setLineDash([]);

  // ===== the wheel =====
  g2d.save();
  g2d.translate(cx, cy);
  g2d.rotate(wheelAngle);

  for (let bar = 0; bar < 12; bar++) {
    const cell = PROG[bar];
    const a0 = -Math.PI / 2 + bar * SLICE - SLICE / 2;
    const a1 = a0 + SLICE;
    for (let h = 0; h < cell.length; h++) {
      const ha0 = cell.length === 2 ? a0 + h * SLICE / 2 : a0;
      const ha1 = cell.length === 2 ? ha0 + SLICE / 2 : a1;
      const lit = bar === hlBar && (cell.length === 1 || h === hlHalf);

      g2d.beginPath();
      g2d.arc(0, 0, R, ha0, ha1);
      g2d.arc(0, 0, hubR, ha1, ha0, true);
      g2d.closePath();
      if (lit) {
        const pulse = playing ? 1 - 0.12 * beatPhase : 0.9 + 0.1 * Math.sin(t * 3);
        g2d.fillStyle = "rgba(255,255,255," + (0.92 * pulse).toFixed(2) + ")";
        g2d.fill();
      } else if (CH[cell[h]].roman === "i") {
        g2d.fillStyle = "rgba(255,255,255,0.05)";
        g2d.fill();
      }
      g2d.strokeStyle = "#fff"; g2d.lineWidth = 1.2; g2d.stroke();
    }
  }

  // sector labels
  for (let bar = 0; bar < 12; bar++) {
    const cell = PROG[bar];
    for (let h = 0; h < cell.length; h++) {
      const mid = -Math.PI / 2 + bar * SLICE
        + (cell.length === 2 ? (h ? SLICE / 4 : -SLICE / 4) : 0);
      const lit = bar === hlBar && (cell.length === 1 || h === hlHalf);
      const rr = (R + hubR) / 2;
      const lx = Math.cos(mid) * rr, ly = Math.sin(mid) * rr;
      g2d.save();
      g2d.translate(lx, ly);
      let rot = mid + Math.PI / 2;
      if (Math.sin(mid) > 0.02) rot += Math.PI;
      g2d.rotate(rot);
      g2d.fillStyle = lit ? "#000" : "#fff";
      g2d.textAlign = "center";
      const small = cell.length === 2;
      g2d.font = "600 " + Math.max(small ? 11 : 13, R * (small ? 0.062 : 0.085)) + "px 'SF Mono', Menlo, Consolas, monospace";
      g2d.fillText(CH[cell[h]].roman, 0, -R * 0.02);
      g2d.font = Math.max(9, R * 0.05) + "px 'SF Mono', Menlo, Consolas, monospace";
      g2d.globalAlpha = lit ? 0.75 : 0.55;
      g2d.fillText(chordName(cell[h]), 0, R * 0.055);
      g2d.globalAlpha = 1;
      // swapped-in chord gets a marker so the experiment is visible
      if (cell[h] !== BARS[bar][h]) {
        g2d.beginPath();
        g2d.arc(0, R * 0.13, 2.4, 0, Math.PI * 2);
        g2d.fillStyle = lit ? "#000" : "#fff";
        g2d.fill();
      }
      g2d.restore();
    }
  }

  // bar numbers riding the rim
  g2d.fillStyle = "rgba(255,255,255,0.5)";
  for (let bar = 0; bar < 12; bar++) {
    const mid = -Math.PI / 2 + bar * SLICE;
    const rx = Math.cos(mid) * R * 1.06, ry = Math.sin(mid) * R * 1.06;
    g2d.save();
    g2d.translate(rx, ry);
    g2d.rotate(-wheelAngle);
    g2d.font = Math.max(9, R * 0.045) + "px 'SF Mono', Menlo, Consolas, monospace";
    g2d.textAlign = "center"; g2d.textBaseline = "middle";
    g2d.fillText(String(bar + 1).padStart(2, "0"), 0, 0);
    g2d.restore();
  }

  g2d.restore();

  // ===== hub =====
  g2d.fillStyle = "#000";
  g2d.beginPath(); g2d.arc(cx, cy, hubR - 1, 0, Math.PI * 2); g2d.fill();
  g2d.strokeStyle = "#fff"; g2d.lineWidth = 1.2;
  g2d.beginPath(); g2d.arc(cx, cy, hubR, 0, Math.PI * 2); g2d.stroke();
  g2d.setLineDash([1, 5]);
  g2d.strokeStyle = "rgba(255,255,255,0.4)";
  g2d.beginPath(); g2d.arc(cx, cy, hubR * 0.86, 0, Math.PI * 2); g2d.stroke();
  g2d.setLineDash([]);

  g2d.textAlign = "center"; g2d.textBaseline = "middle";
  g2d.fillStyle = "#fff";
  g2d.font = "700 " + Math.max(22, R * 0.17) + "px 'SF Mono', Menlo, Consolas, monospace";
  g2d.fillText(CH[hubId].roman, cx, cy - hubR * 0.18);
  g2d.font = Math.max(12, R * 0.075) + "px 'SF Mono', Menlo, Consolas, monospace";
  g2d.globalAlpha = 0.75;
  g2d.fillText(chordName(hubId), cx, cy + hubR * 0.16);
  g2d.globalAlpha = 1;

  if (playing) {
    const lampY = cy + hubR * 0.5;
    for (let b = 0; b < 4; b++) {
      const lx = cx + (b - 1.5) * hubR * 0.24;
      g2d.beginPath(); g2d.arc(lx, lampY, hubR * 0.045, 0, Math.PI * 2);
      if (b === inBar) { g2d.fillStyle = "#fff"; g2d.fill(); }
      else { g2d.strokeStyle = "rgba(255,255,255,0.6)"; g2d.lineWidth = 1; g2d.stroke(); }
    }
  } else {
    g2d.font = Math.max(8, R * 0.042) + "px 'SF Mono', Menlo, Consolas, monospace";
    g2d.fillStyle = "rgba(255,255,255,0.55)";
    g2d.fillText(selBar >= 0 ? "◂ ▸ SWAPS THIS CHORD" : "TAP A SECTOR TO HEAR IT", cx, cy + hubR * 0.52);
  }

  // ===== fixed pointer at 12 o'clock =====
  const py = cy - R;
  g2d.strokeStyle = "#fff"; g2d.lineWidth = 1.4;
  g2d.beginPath();
  g2d.moveTo(cx, py - 26); g2d.lineTo(cx, py - 8);
  g2d.stroke();
  g2d.beginPath();
  g2d.moveTo(cx - 9, py - 22); g2d.lineTo(cx, py - 6); g2d.lineTo(cx + 9, py - 22);
  g2d.closePath();
  g2d.fillStyle = "#fff"; g2d.fill();

  // ===== HUD =====
  g2d.textAlign = "left"; g2d.textBaseline = "top";
  g2d.fillStyle = "#fff";
  g2d.font = "700 14px 'SF Mono', Menlo, Consolas, monospace";
  g2d.fillText("BLUES ORBIT", 18, 16);
  g2d.font = "10px 'SF Mono', Menlo, Consolas, monospace";
  g2d.fillStyle = "rgba(255,255,255,0.6)";
  g2d.fillText("MINOR BLUES · 12 SECTORS · " + KEYS[keyIdx].name.toUpperCase(), 18, 36);
  g2d.fillText(playing ? "SECTOR " + String(cur.bar + 1).padStart(2, "0") + "/12"
                       : (selBar >= 0 ? "AUDITION · BAR " + String(selBar + 1).padStart(2, "0") : "READY"), 18, 50);
  if (isModified()) g2d.fillText("EXPERIMENTAL PROGRESSION · RESET RESTORES", 18, 64);

  g2d.textAlign = "right";
  g2d.fillText("i · iv · ♭VI · V7 · iiø7 · V7♭9", W - 18, 16);
  g2d.fillText(playing ? "STATUS: IN ORBIT" : "STATUS: HOLDING", W - 18, 30);
}

/* ================= WIRING ================= */

const playBtn = document.getElementById("playBtn");
const keySel = document.getElementById("keySel");
const bpmIn = document.getElementById("bpm");
const bpmVal = document.getElementById("bpmVal");
const fsBtn = document.getElementById("fsBtn");
const tapHint = document.getElementById("tapHint");
const editGrp = document.getElementById("editGrp");
const editLbl = document.getElementById("editLbl");
const resetBtn = document.getElementById("resetBtn");

KEYS.forEach((k, i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = k.name;
  keySel.appendChild(o);
});

function updateEditUI() {
  editGrp.hidden = playing || selBar < 0;
  resetBtn.hidden = !isModified();
  if (selBar >= 0) {
    editLbl.textContent = "BAR " + (selBar + 1) +
      (PROG[selBar].length === 2 ? (selHalf ? "B" : "A") : "");
  }
}

playBtn.addEventListener("click", () => playing ? stop() : start());
keySel.addEventListener("change", () => { keyIdx = +keySel.value; });
bpmIn.addEventListener("input", () => {
  const pos = songBeat();
  bpm = +bpmIn.value;
  bpmVal.textContent = bpm;
  if (playing) {
    songStart = ctx.currentTime - pos * beatDur();
    nextBeatTime = songStart + nextBeat * beatDur();
  }
});
fsBtn.addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});
tapHint.addEventListener("click", () => { tapHint.remove(); start(); });

// tap a sector while stopped: select it and hear a gentle arpeggio
cv.addEventListener("pointerdown", e => {
  if (playing) return;
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const { cx, cy, R, hubR } = geo();
  const dx = x - cx, dy = y - cy;
  const dist = Math.hypot(dx, dy);
  if (dist < hubR || dist > R * 1.08) { selBar = -1; updateEditUI(); return; }
  const rel = (Math.atan2(dy, dx) - wheelAngle + Math.PI / 2) / SLICE;
  let bar = Math.round(rel);
  const frac = rel - bar;
  bar = ((bar % 12) + 12) % 12;
  selBar = bar;
  selHalf = (PROG[bar].length === 2 && frac >= 0) ? 1 : 0;
  playArp(PROG[selBar][selHalf]);
  updateEditUI();
});

function swapChord(dir) {
  if (selBar < 0) return;
  const cell = PROG[selBar];
  const cur = cell[selHalf];
  let i = PALETTE.indexOf(cur);
  if (i < 0) i = 0;
  const next = PALETTE[((i + dir) % PALETTE.length + PALETTE.length) % PALETTE.length];
  cell[selHalf] = next;
  playArp(next);
  updateEditUI();
}
document.getElementById("prevCh").addEventListener("click", () => swapChord(-1));
document.getElementById("nextCh").addEventListener("click", () => swapChord(1));
resetBtn.addEventListener("click", () => {
  PROG = BARS.map(c => c.slice());
  selBar = -1;
  updateEditUI();
});

// state mirrored into the DOM (readable by automated checks)
setInterval(() => {
  const d = document.body.dataset;
  d.playing = playing;
  d.beat = songBeat().toFixed(2);
  d.sel = selBar;
  d.prog = PROG.map(c => c.join("+")).join("|");
}, 200);

resize();
requestAnimationFrame(draw);
setTimeout(resize, 60);
</script>
</body>
