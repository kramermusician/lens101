<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Party</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6efe2; overflow: hidden; font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #2b2620; }
  canvas { display: block; }
  #error { display: none; max-width: 900px; margin: 60px auto; padding: 30px; background: #fffdf8; border: 6px solid #b0522c; border-radius: 20px; font-size: 22px; }
  #error h1 { margin-top: 0; color: #b0522c; }
  #error ul { line-height: 1.5; }
  #export { display: none; position: fixed; right: 24px; bottom: 24px; font: 700 20px "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; padding: 12px 22px; border-radius: 14px; border: 4px solid #5f7d50; background: #fffdf8; color: #5f7d50; cursor: pointer; }
  #export:hover { background: #dfe8d2; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="export" type="button">Export leaderboard JSON</button>
<div id="error">
  <h1>Key Party will not start</h1>
  <p>The music theory self-check found wrong answers. The game refuses to run until js/theory.js is fixed. Run <code>node js/theory.test.js</code> for the same report.</p>
  <ul></ul>
</div>
<script src="js/theory.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/arena.js"></script>
<script src="js/game-bucket.js"></script>
<script src="js/game-stampede.js"></script>
<script src="js/game-corners.js"></script>
<script src="js/game-blues.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/main.js"></script>
</body>
</html>
